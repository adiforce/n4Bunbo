<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>N4 聽力練習</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.svg">
<style>
:root{--bg:#fff8f3;--card:#fff;--ink:#3b3340;--sub:#8a7f8e;--line:#f0e4dc;--pri:#ff7a59;--pri2:#ffe1d6;--ok:#2fa36b;--okbg:#e3f6ec;--ng:#e0475b;--ngbg:#fde6e9;--ctr:#7a5cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Hiragino Sans","Noto Sans TC",sans-serif;font-size:16px;line-height:1.6;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 14px 6px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center}
h1 small{font-size:13px;color:var(--sub);font-weight:500}
.speeds{display:flex;gap:6px}
.speeds button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 0;font-size:13px;color:var(--ink);line-height:1.2}
.speeds button b{display:block;font-size:14px}
.speeds button.on{border-color:var(--pri);background:var(--pri2);color:#b8401f}
.meter{font-size:12px;color:var(--sub);margin-top:4px;display:flex;justify-content:space-between}
details{font-size:13px;color:var(--sub);margin-top:4px}
details select{width:100%;margin:3px 0 6px;padding:5px;border-radius:8px;border:1px solid var(--line);font-size:14px}
main{padding:12px 14px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 2px 10px rgba(120,80,60,.07);margin-bottom:12px}
.tag{display:inline-block;background:var(--pri2);color:#b8401f;border-radius:20px;padding:2px 10px;font-size:13px;font-weight:600}
.qno{font-size:22px;font-weight:700;margin:6px 0 2px}
.hint{font-size:13px;color:var(--sub)}
.ctrl{display:flex;gap:8px;margin:12px 0}
.ctrl button{flex:1;border:none;border-radius:14px;padding:12px 0;font-size:16px;font-weight:600}
.play{background:var(--pri);color:#fff}
.stop{background:#eee;color:var(--ink)}
.peek{background:#f3eefe;color:var(--ctr)}
.choices{display:flex;flex-direction:column;gap:8px}
.choices.row{flex-direction:row}
.choices button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-size:17px;text-align:left;color:var(--ink)}
.choices.row button{flex:1;text-align:center;font-size:20px;font-weight:700}
.choices button .n{display:inline-block;width:24px;height:24px;border-radius:50%;background:var(--pri2);color:#b8401f;font-size:13px;text-align:center;line-height:24px;margin-right:8px;font-weight:700}
.choices button.ok{border-color:var(--ok);background:var(--okbg)}
.choices button.ng{border-color:var(--ng);background:var(--ngbg)}
.choices button:disabled{color:var(--ink);opacity:1}
.res{font-weight:700;font-size:17px;margin:12px 0 4px}
.res.ok{color:var(--ok)}.res.ng{color:var(--ng)}
.script{margin-top:8px}
.ln{display:flex;gap:8px;padding:8px 0;border-top:1px dashed var(--line);align-items:flex-start}
.ln .who{flex:none;width:26px;height:26px;border-radius:50%;font-size:12px;text-align:center;line-height:26px;font-weight:700;margin-top:2px}
.who.M{background:#dcecff;color:#2b6cc4}.who.F{background:#ffe0ec;color:#c43b72}.who.N{background:#eee;color:#666}
.ln .tx{flex:1}
.ln .ja{font-size:17px}
.ln .zh{font-size:13px;color:var(--sub)}
.ln button{flex:none;border:none;background:var(--pri2);color:#b8401f;border-radius:50%;width:34px;height:34px;font-size:14px}
.ln.speaking{background:#fff4ec}
.ctr{color:var(--ctr);font-weight:700;border-bottom:2px solid #d8ccff}
.ctr small{font-weight:500;font-size:11px;margin-left:2px}
.exp{background:#fffaf0;border-radius:12px;padding:10px 12px;font-size:15px;margin-top:10px}
.exp b{color:#b8401f}
.nav{display:flex;gap:8px}
.nav button{flex:1;border:none;border-radius:14px;padding:12px 0;font-size:16px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:10px}
.grid button{border:none;border-radius:8px;padding:7px 0;font-size:13px;background:#fff;color:var(--ink)}
.grid button.cur{outline:2px solid var(--pri)}
.grid button.ok{background:var(--okbg);color:var(--ok)}
.grid button.ng{background:var(--ngbg);color:var(--ng)}
.score{font-size:14px;color:var(--sub);display:flex;justify-content:space-between;margin-top:10px}
.score button{border:none;background:none;color:var(--sub);text-decoration:underline;font-size:13px}
.warn{background:var(--ngbg);color:var(--ng);padding:10px;border-radius:10px;font-size:14px;display:none;margin-bottom:10px}
</style>
</head>
<body>
<header>

  </details>
</header>
<main>
  <div class="warn" id="warn">這個瀏覽器不支援語音朗讀，請改用 iPhone Safari 或電腦 Chrome。</div>
  <div class="card" id="qcard"></div>
  <div class="nav"><button id="prev">← 上一題</button><button id="next">下一題 →</button></div>
  <div class="card" style="margin-top:12px">
    <div class="grid" id="grid"></div>
    <div class="score"><span id="score"></span><button id="reset">清除作答紀錄</button></div>
  </div>
</main>

  } else {
    q.lines.forEach(l=>seq.push({...l,pause:800}));
    q.opts.forEach((o,k)=>{ seq.push(N(NUMS[k],250)); seq.push({...o,pause:700}); });
  }
  return seq;
}
function markSpeaking(item){
  document.querySelectorAll('.ln').forEach(el=>el.classList.toggle('speaking', !!item && el.dataset.t===item.t));
}

/* ---------- render ---------- */
function lineHTML(l, label){
  const who = label || (l.s==='M'?'男':l.s==='F'?'女':'旁');
  return `<div class="ln" data-t="${l.t.replace(/"/g,'&quot;')}">
    <span class="who ${label?'N':l.s}">${who}</span>
    <div class="tx"><div class="ja">${l.h}</div>${l.z?`<div class="zh">${l.z}</div>`:''}</div>
    <button data-play="${l.t.replace(/"/g,'&quot;')}" data-s="${l.s}">▶</button></div>`;
}
function scriptHTML(q){
  let h = '';
  if(q.intro) h += lineHTML(q.intro);
  q.lines.forEach(l=>h+=lineHTML(l));
  if(q.question) h += lineHTML(q.question);
  if(q.opts) q.opts.forEach((o,k)=>h+=lineHTML(o, String(k+1)));
  return h;
}
function render(){
  const q = DATA[cur], a = answers[cur];
  const answered = a !== undefined;
  const isText = q.type<=2;
  let ch = '';
  if(isText){
    ch = `<div class="choices">${q.choices.map((c,k)=>`<button data-k="${k}" class="${answered?(k===q.answer?'ok':(k===a?'ng':'')):''}" ${answered?'disabled':''}><span class="n">${k+1}</span>${c}</button>`).join('')}</div>`;
  } else {
    ch = `<div class="choices row">${q.opts.map((c,k)=>`<button data-k="${k}" class="${answered?(k===q.answer?'ok':(k===a?'ng':'')):''}" ${answered?'disabled':''}>${k+1}</button>`).join('')}</div>`;
  }
  let after = '';
  if(answered){
    const ok = a===q.answer;
    after = `<div class="res ${ok?'ok':'ng'}">${ok?'⭕ 答對了':'❌ 答錯了，正確答案是 '+(q.answer+1)}</div>
      <div class="hint">點 ▶ 可以一句一句重聽；紫色字是口語縮約音。</div>
      <div class="script">${scriptHTML(q)}</div>
      <div class="exp"><b>解說</b><br>${q.explain}</div>`;
  } else if(peeked[cur]){
    after = `<div class="hint" style="margin-top:10px">（偷看原文中，作答後會顯示翻譯和解說）</div>
      <div class="script">${scriptHTML({...q, lines:q.lines.map(l=>({...l,z:''})), intro:q.intro?{...q.intro,z:''}:null, question:q.question?{...q.question,z:''}:null, opts:q.opts?q.opts.map(o=>({...o,z:''})):null})}</div>`;
  }
  document.getElementById('qcard').innerHTML = `
    <span class="tag">${TYPES[q.type]}</span>
    <div class="qno">${cur+1} 番</div>
    <div class="hint">${TYPE_HINT[q.type]}</div>
    <div class="ctrl">
      <button class="play" id="playBtn">▶ 播放</button>
      <button class="stop" id="stopBtn">■ 停止</button>
      ${answered?'':`<button class="peek" id="peekBtn">看原文</button>`}
    </div>
    ${ch}${after}`;
  document.getElementById('playBtn').onclick = ()=>playSeq(buildSeq(q,cur));
  document.getElementById('stopBtn').onclick = stopAll;
  const pk = document.getElementById('peekBtn');
  if(pk) pk.onclick = ()=>{ peeked[cur]=true; render(); };
  document.querySelectorAll('.choices button').forEach(b=>b.onclick=()=>{
    if(answers[cur]!==undefined) return;
    answers[cur] = +b.dataset.k; store.set('answers',answers); render(); renderGrid();
  });
  document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>{
    const t=b.dataset.play, s=b.dataset.s;
    const all=[q.intro,...q.lines,q.question,...(q.opts||[])].filter(Boolean);
    const it = all.find(x=>x.t===t) || {s,t,m:0};
    playSeq([{...it,pause:0}]);
  });
  store.set('cur',cur);
}
function renderGrid(){
  document.getElementById('grid').innerHTML = DATA.map((q,i)=>{
    const a=answers[i]; const c = a===undefined?'':(a===q.answer?'ok':'ng');
    return `<button class="${c} ${i===cur?'cur':''}" data-i="${i}">${i+1}</button>`;
  }).join('');
  document.querySelectorAll('#grid button').forEach(b=>b.onclick=()=>{ stopAll(); cur=+b.dataset.i; render(); renderGrid(); window.scrollTo(0,0); });
  const done = Object.keys(answers).length;
  const right = Object.entries(answers).filter(([i,a])=>DATA[i] && DATA[i].answer===a).length;
  document.getElementById('score').textContent = `已作答 ${done}/${DATA.length}　答對 ${right}`;
  document.getElementById('hdrScore').textContent = `${right}/${DATA.length}`;
}
document.getElementById('prev').onclick=()=>{ if(cur>0){stopAll();cur--;render();renderGrid();window.scrollTo(0,0);} };
document.getElementById('next').onclick=()=>{ if(cur<DATA.length-1){stopAll();cur++;render();renderGrid();window.scrollTo(0,0);} };
document.getElementById('reset').onclick=()=>{ answers={}; peeked={}; store.set('answers',answers); render(); renderGrid(); };

if(!synth){ document.getElementById('warn').style.display='block'; }
else { loadVoices(); synth.onvoiceschanged = loadVoices; }
renderSpeeds(); render(); renderGrid();
</script>
</body>
</html>
