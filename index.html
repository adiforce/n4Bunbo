<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>穩紮穩打 N4 文法小卡</title>
<style>
:root{--bg:#fff7fa;--card:#fff;--pink:#ffd6e5;--mint:#d4f3e6;--sky:#d6ebff;--lemon:#fff3c4;--coral:#ff6b4a;--ink:#4a3f47}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}
header{padding:14px 16px 8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:760px;margin:auto}
header h1{font-size:18px;margin:0;flex:1 1 auto}
#q{flex:1 1 160px;padding:9px 14px;border:2px solid var(--pink);border-radius:999px;font-size:15px;outline:none;background:#fff}
#q:focus{border-color:var(--coral)}
#nav{max-width:760px;margin:0 auto;padding:0 16px 8px;display:flex;gap:6px;flex-wrap:wrap}
#nav button{border:0;background:var(--pink);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
#nav button.on{background:var(--coral);color:#fff}
main{max-width:760px;margin:auto;padding:8px 16px 60px}
.unit{font-size:14px;color:#a07c8d;margin:18px 0 8px;font-weight:700}
.card{background:var(--card);border-radius:22px;box-shadow:0 4px 0 var(--pink);margin-bottom:22px;overflow:hidden;border:2px solid var(--pink)}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px 0}
.no{background:var(--lemon);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.title{font-size:26px;font-weight:800;color:var(--coral)}
.scene{position:relative;height:130px;margin:10px 14px;border-radius:16px;background:linear-gradient(var(--sky) 0 72%,var(--mint) 72%);overflow:hidden;cursor:pointer}
.scene .e{position:absolute;font-size:38px;line-height:1}
.scene .g{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:11px;background:#fff9;border-radius:99px;padding:1px 8px}
.pop{position:absolute;background:var(--coral);color:#fff;font-weight:800;border-radius:12px;padding:2px 10px;font-size:20px}
.sec{padding:0 16px 10px}
.lab{display:inline-block;font-size:12px;font-weight:700;background:var(--sky);border-radius:8px;padding:1px 8px;margin-bottom:4px}
.formula{font-size:16px;line-height:1.7;background:var(--lemon);border-radius:12px;padding:6px 12px}
.explain{line-height:1.8;font-size:15px}
.ex{border:2px dashed var(--pink);border-radius:14px;padding:8px 12px;margin:8px 0;cursor:pointer;transition:.15s}
.ex:hover{background:#fff3f8}
.ex .jp{font-size:19px;font-weight:700}
.ex .zh{font-size:14px;margin-top:2px}
.ex .more{display:none;margin-top:6px;font-size:14px;line-height:1.7;background:var(--mint);border-radius:10px;padding:6px 10px}
.ex.open .more{display:block}
.hint{font-size:12px;color:#b08fa0}
.cmp{background:var(--pink);border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.7;margin:0 16px 16px}
.empty{text-align:center;color:#a07c8d;padding:40px}
/* animations */
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
@keyframes wiggle{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}
@keyframes bite{0%,15%{transform:scale(1)}30%{transform:scale(.7)}45%{transform:scale(.7)}60%{transform:scale(.4)}75%,90%{transform:scale(.4);opacity:1}100%{transform:scale(1)}}
@keyframes chew{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
@keyframes walkto{0%{left:6%}70%,100%{left:58%}}
@keyframes land{0%,60%{transform:scale(1)}75%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes drive{0%{left:-20%}100%{left:105%}}
@keyframes bump{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
@keyframes walkr{0%{left:4%}100%{left:60%}}
@keyframes pophop{0%,60%,100%{opacity:0;transform:translateY(6px)}70%,95%{opacity:1;transform:translateY(0)}}
.leg rect{transform-box:fill-box;transform-origin:50% 0}
.kid .l rect{animation:swA .5s ease-in-out infinite}
.kid .r rect{animation:swB .5s ease-in-out infinite}
.kid.still .leg rect{animation:none}
.kid.chew .head{transform-box:fill-box;transform-origin:50% 100%;animation:chew2 .5s ease-in-out infinite}
@keyframes swA{0%,100%{transform:rotate(26deg)}50%{transform:rotate(-26deg)}}
@keyframes swB{0%,100%{transform:rotate(-26deg)}50%{transform:rotate(26deg)}}
@keyframes chew2{0%,100%{transform:rotate(0) translateY(0)}50%{transform:rotate(7deg) translateY(1px)}}
.wig{animation:wig .8s ease-in-out infinite}
@keyframes wig{0%,100%{transform:translateX(0)}50%{transform:translateX(12px)}}
.jump{animation:jump 1s ease-in-out infinite}
@keyframes jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
.apple{transform-box:fill-box;transform-origin:50% 100%;animation:bite2 3s infinite}
@keyframes bite2{0%,10%{transform:scale(1)}30%,40%{transform:scale(.72)}60%,70%{transform:scale(.42)}85%{transform:scale(.42);opacity:1}86%{opacity:0}100%{transform:scale(1);opacity:1}}
.mvni{animation:mvni 3.2s ease-out infinite}
@keyframes mvni{0%{transform:translateX(0)}70%,100%{transform:translateX(190px)}}
.mvhe{animation:mvhe 3.5s linear infinite}
@keyframes mvhe{0%{transform:translateX(0)}100%{transform:translateX(130px)}}
.mvbus{animation:mvbus 4.5s linear infinite}
@keyframes mvbus{0%{transform:translateX(0)}100%{transform:translateX(430px)}}
.bounce{animation:bnc .35s ease-in-out infinite}
@keyframes bnc{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pls 1.2s ease-in-out infinite}
@keyframes pls{0%,100%{transform:translate(0,-50px) scale(1)}50%{transform:translate(0,-50px) scale(1.15)}}
@keyframes popin{0%,60%{opacity:0;transform:translateY(6px)}72%,95%{opacity:1;transform:translateY(0)}100%{opacity:0}}
#pager{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:center;gap:14px;padding:10px;background:#fffc;backdrop-filter:blur(6px);border-top:2px solid var(--pink)}
#pager button{border:0;background:var(--coral);color:#fff;font-size:15px;font-weight:700;border-radius:999px;padding:9px 18px;cursor:pointer}
#pager button:disabled{background:#e8d5de;cursor:default}
#pinfo{font-weight:700;min-width:90px;text-align:center}
main{padding-bottom:90px}
.mvka{animation:mvka 3.6s linear infinite}
@keyframes mvka{0%{transform:translateX(0)}100%{transform:translateX(190px)}}
.mvma{animation:mvma 3.6s ease-out infinite}
@keyframes mvma{0%{transform:translateX(0)}75%,100%{transform:translateX(205px)}}
.grow{transform-box:fill-box;transform-origin:0 50%;animation:growx 3.6s ease-out infinite}
@keyframes growx{0%{transform:scaleX(.02)}75%,100%{transform:scaleX(1)}}
.mvmi{animation:mvmi 3.6s ease-out infinite}
@keyframes mvmi{0%{transform:translateX(0)}60%,100%{transform:translateX(105px)}}
.paper{animation:paperfly 3.6s infinite}
@keyframes paperfly{0%,60%{opacity:0;transform:translate(0,0)}61%{opacity:1;transform:translate(0,0)}72%{opacity:1;transform:translate(34px,-18px)}84%{opacity:1;transform:translate(66px,8px)}85%,100%{opacity:0;transform:translate(66px,8px)}}
.appear{transform-box:fill-box;transform-origin:50% 100%;animation:app 4s infinite backwards}
@keyframes app{0%{transform:scale(0);opacity:0}10%{transform:scale(1.2);opacity:1}16%,84%{transform:scale(1);opacity:1}94%,100%{transform:scale(0);opacity:0}}
.dash{animation:dashm 1s linear infinite}
@keyframes dashm{to{stroke-dashoffset:-12}}
.jump2{animation:jump 1.4s ease-in-out infinite}
.beat{transform-box:fill-box;transform-origin:50% 50%;animation:beat 1.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
@keyframes beatp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.spot{opacity:.5;animation:spotp 1.6s ease-in-out infinite}
@keyframes spotp{0%,100%{opacity:.3}50%{opacity:.7}}
.puff{transform-box:fill-box;transform-origin:50% 50%;animation:puff 2s ease-in-out infinite}
@keyframes puff{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.seq{transform-box:fill-box;transform-origin:50% 100%;animation:seq 4.5s infinite backwards;opacity:0}
@keyframes seq{0%{opacity:0;transform:scale(.5)}5%{opacity:1;transform:scale(1.2)}10%,28%{opacity:1;transform:scale(1)}33%,100%{opacity:0;transform:scale(.5)}}
.giant{transform-box:fill-box;transform-origin:50% 100%;animation:giant 3s ease-in-out infinite}
@keyframes giant{0%{transform:scale(.6)}50%,80%{transform:scale(2.3)}100%{transform:scale(.6)}}
.mvtu{animation:mvtu 7s linear infinite}
@keyframes mvtu{0%{transform:translateX(0)}100%{transform:translateX(170px)}}
.cfall{animation:cfall 4s infinite}
@keyframes cfall{0%,18%{opacity:1;transform:translateY(0)}32%,100%{opacity:0;transform:translateY(26px)}}
.cslide{opacity:0;animation:cslide 4s infinite}
@keyframes cslide{0%,30%{opacity:0;transform:translateX(30px)}42%,88%{opacity:1;transform:translateX(0)}96%,100%{opacity:0;transform:translateX(0)}}
.cin{opacity:0;animation:cin 4s infinite}
@keyframes cin{0%,20%{opacity:0;transform:translateY(-22px)}34%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}
.seq4{opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:seq4 6s infinite backwards}
@keyframes seq4{0%{opacity:0;transform:scale(.6)}4%{opacity:1;transform:scale(1.1)}8%,22%{opacity:1;transform:scale(1)}26%,100%{opacity:0;transform:scale(.6)}}
.mvroll{animation:mvroll 3s linear infinite}
@keyframes mvroll{from{transform:translateX(0)}to{transform:translateX(190px)}}
.rot{transform-box:fill-box;transform-origin:50% 50%;animation:spin .9s linear infinite}
.push{animation:push 6s linear infinite}
@keyframes push{from{transform:translateX(0)}to{transform:translateX(22px)}}
.rotslow{transform-box:fill-box;transform-origin:50% 50%;animation:rot53 6s linear infinite}
@keyframes rot53{to{transform:rotate(53deg)}}
.drop{opacity:0;stroke:#5aa0ff;stroke-width:3;stroke-linecap:round;animation:drop 1s linear infinite}
@keyframes drop{0%{opacity:0;transform:translateY(0)}8%{opacity:1}90%{opacity:1}100%{opacity:0;transform:translateY(50px)}}
.dash2cat{animation:dash2 3.2s ease-in infinite}
@keyframes dash2{0%,40%{transform:translateX(0)}62%,100%{transform:translateX(150px)}}
.excl{opacity:0;animation:excl 3.2s infinite}
@keyframes excl{0%,34%{opacity:0;transform:translateY(4px)}40%,56%{opacity:1;transform:translateY(0)}62%,100%{opacity:0}}
.mvtu2{animation:mvtu2 9s linear infinite}
@keyframes mvtu2{from{transform:translateX(0)}to{transform:translateX(165px)}}
.mvfast{animation:mvfast 2.6s ease-out infinite}
@keyframes mvfast{0%{transform:translateX(0)}80%,100%{transform:translateX(205px)}}
.hand{transform-origin:0 0;animation:spin .9s linear infinite}
.zz{opacity:0;animation:zz 3s infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(14px,-26px)}}
.chk{opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:chk 3s infinite}
@keyframes chk{0%,80%{opacity:0;transform:scale(.4)}88%{opacity:1;transform:scale(1.3)}95%,100%{opacity:1;transform:scale(1)}}
.nib{transform-box:fill-box;transform-origin:50% 100%;animation:nib 3s infinite}
@keyframes nib{0%,20%{transform:scale(1)}40%,70%{transform:scale(.8)}100%{transform:scale(1)}}
.tofr{animation:tofr 3.4s ease-in-out infinite}
@keyframes tofr{0%,10%{opacity:1;transform:translate(0,0) scale(1)}60%{opacity:1;transform:translate(120px,-26px) scale(.9)}85%{opacity:1;transform:translate(166px,-22px) scale(.55)}95%,100%{opacity:0;transform:translate(166px,-22px) scale(.4)}}
.vanish{transform-box:fill-box;transform-origin:50% 100%;animation:vanish 3.4s infinite}
@keyframes vanish{0%,20%{opacity:1;transform:scale(1)}32%,92%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
.mvrain{animation:mvrain 6s linear infinite}
@keyframes mvrain{from{transform:translateX(0)}to{transform:translateX(170px)}}
.tcome{animation:tcome 3s ease-out infinite}
@keyframes tcome{0%{transform:translateX(0)}70%,100%{transform:translateX(-135px)}}
.tgo{animation:tgo 3s ease-in infinite}
@keyframes tgo{0%{transform:translateX(0)}80%,100%{transform:translateX(150px)}}
.apple2{transform-box:fill-box;transform-origin:50% 100%;animation:bite3 3s infinite}
@keyframes bite3{0%,10%{transform:scale(1);opacity:1}30%,40%{transform:scale(.72)}60%,85%{transform:scale(.42);opacity:1}88%,99%{transform:scale(.42);opacity:0}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<header>
  <h1>🌸 穩紮穩打 N4 文法小卡</h1>
  <input id="q" placeholder="搜尋：が、吃、地點、方向…">
</header>
<div id="nav"></div>
<main id="list"></main>
<div id="pager"><button id="prevB">◀ 上一個</button><span id="pinfo"></span><button id="nextB">下一個 ▶</button></div>

<script>
/* ===== 場景模板（共用動畫，每張卡只選一個） ===== */
const KID=(cls='')=>`<g class="kid ${cls}">
<g class="leg l"><rect x="-8" y="22" width="7" height="17" rx="3.5" fill="#f2c4a0"/><ellipse cx="-3" cy="40" rx="6.5" ry="3.2" fill="#fff" stroke="#e0c9d4" stroke-width="1"/></g>
<g class="leg r"><rect x="1" y="22" width="7" height="17" rx="3.5" fill="#f2c4a0"/><ellipse cx="6" cy="40" rx="6.5" ry="3.2" fill="#fff" stroke="#e0c9d4" stroke-width="1"/></g>
<rect x="-12" y="3" width="24" height="24" rx="9" fill="#fff" stroke="#4a3f47" stroke-width="1.8"/>
<path d="M-13 21 H13 L14 31 Q14 33 12 33 H2 L0 27 L-2 33 H-12 Q-14 33 -14 31Z" fill="#ff9a3c"/>
<g class="head">
<g fill="#5a3d2e"><circle cx="-2" cy="-16" r="20"/><circle cx="-2" cy="-36" r="8"/><circle cx="-15" cy="-31" r="8"/><circle cx="12" cy="-31" r="8"/><circle cx="-22" cy="-18" r="8"/><circle cx="-19" cy="-5" r="7"/><circle cx="20" cy="-20" r="7"/></g>
<circle cx="2" cy="-9" r="16.5" fill="#ffe1c9"/>
<circle cx="9" cy="-10" r="2.4" fill="#4a3f47"/><circle cx="13" cy="-3" r="2.8" fill="#ff9aa8" opacity=".75"/>
<path d="M6 -1 Q9 3 12 -1" stroke="#4a3f47" fill="none" stroke-width="1.5" stroke-linecap="round"/></g></g>`;
const CAT=`<g><path d="M20 22 Q42 14 35 -4" stroke="#ffa24d" stroke-width="7" fill="none" stroke-linecap="round"/>
<path d="M33 16 L38 12 M37 6 L42 4 M36 -1 L41 -3" stroke="#d9691a" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="0" cy="18" rx="21" ry="15" fill="#ffa24d"/>
<path d="M-12 6 L-6 12 M-4 4 L-1 11 M5 4 L3 11 M13 7 L8 12" stroke="#d9691a" stroke-width="3" stroke-linecap="round"/>
<circle cx="0" cy="-5" r="17" fill="#ffa24d"/>
<path d="M-15 -15 L-13 -33 L-3 -20Z M15 -15 L13 -33 L3 -20Z" fill="#ffa24d"/>
<path d="M-12 -19 L-12 -27 L-6 -21Z M12 -19 L12 -27 L6 -21Z" fill="#ffb8c8"/>
<path d="M0 -21 V-13 M-6 -20 L-5 -14 M6 -20 L5 -14" stroke="#d9691a" stroke-width="2.6" stroke-linecap="round"/>
<path d="M-17 -4 H-11 M-17 1 L-11 0 M17 -4 H11 M17 1 L11 0" stroke="#d9691a" stroke-width="2.4" stroke-linecap="round"/>
<ellipse cx="0" cy="2" rx="7" ry="5" fill="#fff3e0"/>
<circle cx="-6" cy="-6" r="2.3" fill="#4a3f47"/><circle cx="6" cy="-6" r="2.3" fill="#4a3f47"/>
<path d="M-1.5 -1 H1.5 L0 1Z" fill="#ff8aa0"/>
<path d="M-3 3 Q0 5.5 3 3" stroke="#4a3f47" fill="none" stroke-width="1.4" stroke-linecap="round"/></g>`;
const SCHOOL=`<g><rect x="-34" y="-30" width="68" height="46" fill="#ffe0a3"/><path d="M-41 -30 L0 -56 L41 -30Z" fill="#ff8f7a"/>
<rect x="-8" y="-4" width="16" height="20" rx="3" fill="#8b6b4a"/><rect x="-27" y="-21" width="13" height="13" rx="2" fill="#bfe3ff"/><rect x="14" y="-21" width="13" height="13" rx="2" fill="#bfe3ff"/>
<line x1="0" y1="-56" x2="0" y2="-74" stroke="#8b6b4a" stroke-width="2"/><path d="M0 -74 L15 -69 L0 -63Z" fill="#ff6b4a"/></g>`;
const BUS=`<g><rect x="-42" y="-28" width="84" height="40" rx="11" fill="#ffd35c"/>
<rect x="-33" y="-19" width="16" height="15" rx="3" fill="#bfe3ff"/><rect x="-12" y="-19" width="16" height="15" rx="3" fill="#bfe3ff"/><rect x="9" y="-19" width="14" height="15" rx="3" fill="#bfe3ff"/><path d="M27 -19 H36 Q40 -19 40 -14 V-4 H27Z" fill="#bfe3ff"/>
<circle cx="40" cy="6" r="3.2" fill="#fff"/><rect x="-42" y="2" width="84" height="4" fill="#ff9ec4"/>
<g transform="translate(-22,14)"><g class="spin"><circle r="10" fill="#4a3f47"/><circle r="4" fill="#ddd"/><line x1="-8" y1="0" x2="8" y2="0" stroke="#ddd" stroke-width="2"/></g></g>
<g transform="translate(22,14)"><g class="spin"><circle r="10" fill="#4a3f47"/><circle r="4" fill="#ddd"/><line x1="-8" y1="0" x2="8" y2="0" stroke="#ddd" stroke-width="2"/></g></g></g>`;
const TREE=`<g><rect x="-4" y="-6" width="8" height="26" fill="#a47a52"/><circle cx="0" cy="-16" r="18" fill="#7fd1a3"/></g>`;
const SVG=b=>`<svg viewBox="0 0 300 130" preserveAspectRatio="xMidYMax meet" style="position:absolute;inset:0;width:100%;height:100%">${b}</svg>`;
const SCENES={
ga:SVG(`<g transform="translate(34,64)"><g class="wig"><rect x="-34" y="-12" width="16" height="30" rx="5" fill="#ff9ec4"/>
<rect x="-20" y="-8" width="32" height="26" rx="11" fill="#ffe1c9"/>
<rect x="2" y="-10" width="42" height="11" rx="5.5" fill="#ffe1c9"/>
<path d="M-12 -8 Q-6 -20 4 -10Z" fill="#ffe1c9"/>
<path d="M12 6 H2 M12 12 H2 M10 18 H2" stroke="#e3b698" stroke-width="2" stroke-linecap="round"/>
<path d="M-4 -4 Q2 -8 8 -4" stroke="#e3b698" stroke-width="1.6" fill="none" stroke-linecap="round"/></g></g>
<g transform="translate(205,66)"><g class="jump">${CAT}</g></g>`)
 +`<div class="pop" style="left:calc(50% - 27px);top:10px">が</div><div class="g">「就是這隻！」被點名的主角</div>`,
wo:SVG(`<rect x="170" y="80" width="80" height="8" rx="3" fill="#c8a27a"/><rect x="180" y="88" width="6" height="12" fill="#c8a27a"/><rect x="234" y="88" width="6" height="12" fill="#c8a27a"/>
<g transform="translate(205,80)"><g class="apple"><circle cx="0" cy="-14" r="14" fill="#ff5a5a"/><path d="M0 -28 Q2 -36 8 -36" stroke="#6b4a2f" fill="none" stroke-width="2.5"/><ellipse cx="8" cy="-33" rx="6" ry="3" fill="#6fcf97"/></g></g>
<g transform="translate(130,60)">${KID('still chew')}</g>`)
 +`<div class="pop" style="left:calc(50% + 32px);top:6px">を</div><div class="g">動作直接作用在「蘋果」上</div>`,
ni:SVG(`<g transform="translate(250,82)">${SCHOOL}</g>
<g transform="translate(28,60)"><g class="mvni">${KID()}</g></g>`)
 +`<div class="pop" style="left:calc(50% + 82px);top:6px;animation:popin 3.2s infinite">に</div><div class="g">走到、落在「一個點」上</div>`,
de:SVG(`<g transform="translate(60,80)">${TREE}</g><g transform="translate(250,80)">${TREE}</g>
<g transform="translate(-60,75)"><g class="mvbus"><g class="bounce">${BUS}</g></g></g>`)
 +`<div class="pop" style="left:calc(50% - 27px);top:6px">で</div><div class="g">用「公車」當手段／在這裡做事</div>`,
he:SVG(`<g transform="translate(240,98)"><rect x="-3" y="-62" width="6" height="62" fill="#a47a52"/><g class="pulse" transform="translate(0,-50)"><path d="M-30 -12 H6 V-20 L32 0 L6 20 V12 H-30Z" fill="#ff6b4a"/><text x="-10" y="5" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">へ</text></g></g>
<g transform="translate(28,60)"><g class="mvhe">${KID()}</g></g>`)
 +`<div class="pop" style="left:calc(50% - 27px);top:6px">へ</div><div class="g">朝著「那個方向」前進</div>`
};

const FLAG=(c)=>`<g><rect x="-2" y="-40" width="4" height="40" fill="#8b6b4a"/><path d="M2 -40 H24 L18 -32 L24 -24 H2Z" fill="${c}"/></g>`;
const ROAD=(x1,x2,cls='')=>`<rect class="${cls}" x="${x1}" y="94" width="${x2-x1}" height="8" rx="4" fill="#f3d9a8"/>`;
const CAKE=`<g><rect x="-15" y="-15" width="30" height="15" rx="4" fill="#ffb3cc"/><rect x="-15" y="-20" width="30" height="7" rx="3.5" fill="#fff"/><circle cx="0" cy="-24" r="4" fill="#ff4d6d"/></g>`;

 explain:"「も」＝<b>也</b>。把は／が／を換成も，就變成「也是」。<br>AもBも＝兩個都…；後面接否定就是兩個都不…。<br>注意：に、で、から 這類助詞不會消失，要留著再加も：学校にも行きます（也去學校）。",
 ex:[
 {jp:"私も学生です。",kana:"わたしもがくせいです。",zh:"我也是學生。",why:"私は → 私も，把「は」換成「も」。"},
 {jp:"猫も犬も好きです。",kana:"ねこもいぬもすきです。",zh:"貓和狗我都喜歡。",why:"AもBも＝兩個都。對象的が被も取代。"},
 {jp:"昨日は雨で、今日も雨です。",kana:"きのうはあめで、きょうもあめです。",zh:"昨天下雨，今天也下雨。",why:"今日も＝今天也一樣。"},
 {jp:"肉も魚も食べません。",kana:"にくもさかなもたべません。",zh:"肉和魚都不吃。",why:"AもBも＋否定＝兩個都不…。"}],
 cmp:"💡 も會取代は／が／を，但に、で、へ、から要保留再加も：友達にも会いました。"},
{no:"13",t:"〜でも",scene:"dm",
 form:"名詞 ＋ でも ＋ 動詞（…什麼的；提議）<br>名詞 ＋ でも ＋ 述語（連…也／即使是…）<br>疑問詞 ＋ でも（無論…都）",
 explain:"「でも」有三種常用意思：<br>① <b>舉例提議</b>：ケーキでも食べませんか（要不要吃個蛋糕什麼的？），語氣輕鬆，不是非吃蛋糕不可。<br>② <b>連…都／即使是…</b>：子どもでもできる（連小孩都會）<br>③ <b>無論…都</b>：いつでも（隨時都）、誰でも（任何人都）",
 ex:[
 {jp:"ケーキでも食べませんか。",kana:"ケーキでもたべませんか。",zh:"要不要吃個蛋糕什麼的？",why:"提議時舉一個例子，語氣委婉，後面常接「ませんか」。"},
 {jp:"これは子どもでもできます。",kana:"これはこどもでもできます。",zh:"這個連小孩都做得到。",why:"連小孩都行＝很簡單。"},
 {jp:"日曜日でも、会社へ行きます。",kana:"にちようびでも、かいしゃへいきます。",zh:"即使是星期天也去公司。",why:"就算是休息日也一樣要去。"},
 {jp:"いつでも電話してください。",kana:"いつでもでんわしてください。",zh:"隨時都可以打電話給我。",why:"疑問詞（いつ）＋でも＝無論什麼時候都可以。"}],
 cmp:"💡 句首的「でも」是「可是」，是另一個字，和助詞「でも」不一樣。"},
{no:"14",t:"〜ばかり",scene:"ba",
 form:"名詞 ＋ ばかり ＋ 動詞<br>（が、を 會被「ばかり」取代）",
 explain:"「ばかり」＝<b>老是／光是</b>：全部都是同一種東西、或一直重複同一件事。<br>通常帶有「太多了吧」的語氣（有點抱怨）。<br>が、を會被ばかり取代：ゲームをする → ゲームばかりする。",
 ex:[
 {jp:"弟はゲームばかりしています。",kana:"おとうとはゲームばかりしています。",zh:"弟弟老是在玩遊戲。",why:"ゲームをする的を換成ばかり，表示只玩遊戲。"},
 {jp:"兄は肉ばかり食べます。",kana:"あにはにくばかりたべます。",zh:"哥哥光吃肉。",why:"全部都是肉，其他都不吃。"},
 {jp:"最近、雨ばかり降っています。",kana:"さいきん、あめばかりふっています。",zh:"最近老是在下雨。",why:"雨が降る的が換成ばかり，天天都在下。"}],
 cmp:"💡 和「〜たばかり」（剛剛…）不一樣，別搞混。"},
{no:"15",t:"〜は〜が",scene:"hg",
 form:"話題 ＋ は ＋ 部分／對象 ＋ が ＋ 形容詞・述語",
 explain:"先用「は」說大主題，再用「が」指出它的<b>一個部分</b>或<b>對象</b>。<br>像中文：「這隻貓，眼睛很大」。<br>① 部分：猫は目が大きい（貓，眼睛大）<br>② 喜好、能力的對象：私は日本語がわかる、私は猫が好き",
 ex:[
 {jp:"この猫は目が大きいです。",kana:"このねこはめがおおきいです。",zh:"這隻貓眼睛很大。",why:"先說這隻貓（は），再指出眼睛（が）。"},
 {jp:"田中さんは背が高いです。",kana:"たなかさんはせがたかいです。",zh:"田中先生個子很高。",why:"「背が高い」是固定說法，指個子高。"},
 {jp:"私は日本語が少しわかります。",kana:"わたしはにほんごがすこしわかります。",zh:"我稍微懂一點日文。",why:"わかる的對象用が。"},
 {jp:"私は猫が好きです。",kana:"わたしはねこがすきです。",zh:"我喜歡貓。",why:"好き的對象用が。"}],
 cmp:"💡 一句話裡有兩個「主角」：は＝大主題，が＝小重點。"}
]});

UNITS.push({name:"第04單元　比較・程度",cards:[
{no:"16",t:"AはBより〜",scene:"yo",
 form:"A は B より ＋ 形容詞（A 比 B 更…）",
 explain:"「より」＝<b>比較的基準</b>。<br>「Bより」＝跟 B 比起來；A 是主角，說 A 怎麼樣。<br>公式：<b>A は B より 〜</b>（A 比 B 更～）<br>像比身高：先站好 B 當標準（より前面），再看 A 比它高還是矮。",
 ex:[
 {jp:"バスケットボールはバレーボールより大きいです。",kana:"バスケットボールはバレーボールよりおおきいです。",zh:"籃球比排球大。",why:"主角是籃球（は），被比的是排球（より）。"},
 {jp:"今日は昨日より寒いです。",kana:"きょうはきのうよりさむいです。",zh:"今天比昨天冷。",why:"今日＝A，昨日＝B。"},
 {jp:"私は弟より背が高いです。",kana:"わたしはおとうとよりせがたかいです。",zh:"我比弟弟高。",why:"「背が高い」是固定說法，指個子高。"},
 {jp:"電車はバスより速いです。",kana:"でんしゃはバスよりはやいです。",zh:"電車比公車快。",why:"電車＝A，バス＝B。"}],
 cmp:"💡 主角在前，被比的在「より」前面：A は B より…（A 比 B…）。"},
{no:"17",t:"AとBとどちらが〜",scene:"dc",
 form:"A と B と、どちらが ＋ 形容詞／述語 ですか<br>（A 和 B，哪一個比較～？）",
 explain:"「どちら」＝<b>二選一的問句</b>：A和B之間，哪一個比較～？<br>① 「どちら」＝兩個之中的哪一個（口語可以說「どっち」）<br>② 回答用下一張的句型：Aのほうが〜です。<br>注意：三個以上要改用「どれが一番〜ですか」（哪一個最～）。",
 ex:[
 {jp:"バスケットボールとバレーボールと、どちらが好きですか。",kana:"バスケットボールとバレーボールと、どちらがすきですか。",zh:"籃球和排球，你比較喜歡哪一個？",why:"兩個選一個，用どちら。好き的對象用が。"},
 {jp:"電車とバスと、どちらが速いですか。",kana:"でんしゃとバスと、どちらがはやいですか。",zh:"電車和公車，哪一個比較快？",why:"A と B と、どちらが～ですか是固定句型。"},
 {jp:"夏と冬と、どちらが好きですか。",kana:"なつとふゆと、どちらがすきですか。",zh:"夏天和冬天，你比較喜歡哪一個？",why:"季節也是二選一。"},
 {jp:"東京と大阪と、どちらが人が多いですか。",kana:"とうきょうとおおさかと、どちらがひとがおおいですか。",zh:"東京和大阪，哪裡人比較多？",why:"「人が多い」是は〜が句型：どちらが（主題）＋人が多い。"}],
 cmp:"💡 回答用下一張：Aのほうが〜です。"},
{no:"18",t:"BよりAのほうが〜",scene:"nh",
 form:"B より A のほうが ＋ 形容詞（比起 B，A 更…）<br>A のほうが ＋ 形容詞（回答：A 比較…）",
 explain:"選出贏家的句子！「A<b>のほう</b>」＝A 這一邊，「Bより」＝比起 B。<br>① 完整：<b>BよりAのほうが〜</b>（比起 B，A 比較～）<br>② 簡短回答：<b>Aのほうが〜</b>（Bより 可以省略）<br>像選邊站：我站 A 這一邊！",
 ex:[
 {jp:"バレーボールよりバスケットボールのほうが好きです。",kana:"バレーボールよりバスケットボールのほうがすきです。",zh:"比起排球，我更喜歡籃球。",why:"贏的是籃球，放在「のほう」前面。"},
 {jp:"電車のほうが速いです。",kana:"でんしゃのほうがはやいです。",zh:"電車比較快。",why:"回答問題時，可以省略「バスより」。"},
 {jp:"冬より夏のほうが好きです。",kana:"ふゆよりなつのほうがすきです。",zh:"比起冬天，我更喜歡夏天。",why:"夏＝贏的一邊。"},
 {jp:"兄より弟のほうが背が高いです。",kana:"あによりおとうとのほうがせがたかいです。",zh:"比起哥哥，弟弟個子更高。",why:"弟＝贏的一邊，兄＝被比較的一邊。"}],
 cmp:"💡 「のほう」前面放『贏的那一個』；「より」前面放『輸的那一個』。"},
{no:"19",t:"BはAほど〜ない",scene:"ho",
 form:"B は A ほど ＋ 否定形（B 沒有 A 那麼…）",
 explain:"「ほど」＝<b>到達的程度</b>。「Aほど〜ない」＝<b>沒有 A 那麼～</b>。<br>重點：ほど後面<b>一定要接否定</b>（〜ない、〜ません）。<br>它和「AはBより〜」是同一件事的另一種說法：<br>バスケットボールはバレーボールより大きい ＝ バレーボールはバスケットボールほど大きくない。",
 ex:[
 {jp:"バレーボールはバスケットボールほど大きくないです。",kana:"バレーボールはバスケットボールほどおおきくないです。",zh:"排球沒有籃球那麼大。",why:"籃球是標準（ほど），排球達不到。大きい變成大きくない。"},
 {jp:"今日は昨日ほど寒くないです。",kana:"きょうはきのうほどさむくないです。",zh:"今天沒有昨天那麼冷。",why:"寒い → 寒くない，い形容詞否定。"},
 {jp:"私は兄ほど背が高くないです。",kana:"わたしはあにほどせがたかくないです。",zh:"我沒有哥哥那麼高。",why:"兄是標準，我達不到。"},
 {jp:"この問題は、あの問題ほど難しくないです。",kana:"このもんだいは、あのもんだいほどむずかしくないです。",zh:"這一題沒有那一題那麼難。",why:"難しい → 難しくない。"}],
 cmp:"💡 「ほど」後面一定要接否定；肯定句不能用ほど。"}
]});

UNITS.push({name:"第05單元　指示",cards:[
{no:"20",t:"現場指示（こ・そ・あ・ど）",scene:"sx",
 form:"近說話者：これ／この／ここ／こちら<br>近聽話者：それ／その／そこ／そちら<br>離兩人都遠：あれ／あの／あそこ／あちら<br>疑問：どれ／どの／どこ／どちら",
 explain:"想像你和朋友面對面站著：<br>① <b>こ</b>＝在我這邊（靠近我）<br>② <b>そ</b>＝在你那邊（靠近你）<br>③ <b>あ</b>＝離我們兩個都遠<br>④ <b>ど</b>＝哪一個？（疑問）<br>後面接法：<b>れ</b>＝單獨的東西（これ）、<b>の</b>＝後面要接名詞（この本）、<b>こ</b>＝場所（ここ）。",
 ex:[
 {jp:"これは私の本です。",kana:"これはわたしのほんです。",zh:"這是我的書。",why:"書在說話者手邊，用「こ」。"},

 {jp:"あの建物は何ですか。",kana:"あのたてものはなんですか。",zh:"那棟建築物是什麼？",why:"建築物離兩個人都遠，用「あ」。"},
 {jp:"駅は、どこですか。",kana:"えきは、どこですか。",zh:"車站在哪裡？",why:"問場所用「どこ」。"}],

{no:"21",t:"文脈指示",scene:"cx",
 form:"話裡剛提到的 → そ（それ／その／そこ）<br>你我都知道的、共同的回憶 → あ（あれ／あの／あそこ）",
 explain:"這次指的不是「眼前的東西」，而是<b>話裡出現過的東西</b>。<br>① <b>そ</b>＝對方（或我）剛剛才提到的：「昨天看了電影。」「<b>那部</b>電影怎麼樣？」<br>② <b>あ</b>＝說話的兩個人<b>都知道</b>、有共同回憶的：「<b>那個時候</b>真熱呢。」",
 ex:[
 {jp:"「昨日、映画を見ました。」<br>「その映画は、どうでしたか。」",kana:"きのう、えいがをみました。／その えいがは、どうでしたか。",zh:"「昨天看了電影。」「那部電影怎麼樣？」",why:"對方剛提到的電影，用「その」。"},
 {jp:"駅の前にパン屋があります。<br>そこでパンを買いました。",kana:"えきのまえにパンやがあります。／そこでパンをかいました。",zh:"車站前面有麵包店。我在那裡買了麵包。",why:"「そこ」＝剛提到的那間麵包店。"},

 {jp:"去年の夏、一緒に京都へ行きましたね。<br>あのときは、暑かったですね。",kana:"きょねんのなつ、いっしょにきょうとへいきましたね。／あのときは、あつかったですね。",zh:"去年夏天我們一起去了京都呢。那個時候好熱呢。",why:"兩人共同的回憶，用「あの」。"}],

{no:"22",t:"こんな／そんな／あんな",scene:"kn",

 explain:"「こんな」＝<b>這樣的</b>，用來形容後面名詞的<b>樣子、種類</b>。<br>こ・そ・あ・ど的規則一樣：こんな（近我）、そんな（近你／話裡的）、あんな（遠／共同的）、どんな（什麼樣的）。<br>後面<b>一定要接名詞</b>，常帶著驚訝、不滿或羨慕的情緒。",

 {jp:"そんなことを言わないでください。",kana:"そんなことをいわないでください。",zh:"請不要說那種話。",why:"そんな＝對方剛說的那種。"},
 {jp:"あんな家に住みたいです。",kana:"あんないえにすみたいです。",zh:"我想住在那樣的房子。",why:"あんな＝遠處或大家都知道的那種房子。"},
 {jp:"どんな食べ物が好きですか。",kana:"どんなたべものがすきですか。",zh:"你喜歡什麼樣的食物？",why:"どんな＋名詞，問「什麼樣的」。"}],
 cmp:"💡 こんな＋名詞；こう＋動詞（下一張）。"},
{no:"23",t:"こう／そう／ああ",scene:"ko",

]});

UNITS.push({name:"第06單元　動詞ます形Ⅰ",cards:[
{no:"24",t:"〜ます形",scene:"s24",
 form:"Ⅰ組：最後一個假名 う段 → い段　書く→書きます／飲む→飲みます／話す→話します<br>Ⅱ組：去掉「る」　食べる→食べます／見る→見ます<br>Ⅲ組：する→します／来る（くる）→来ます（きます）",
 explain:"「ます形」＝動詞加上<b>ます</b>的禮貌說法；去掉「ます」剩下的部分（書き、食べ）是之後很多句型的<b>底座</b>（〜たい、〜やすい、〜すぎる、〜始める…）。<br>三組動詞變法不同：<br>① Ⅰ組：最後一個音換成<b>い段</b>（く→き、む→み、す→し）<br>② Ⅱ組：<b>去掉る</b>，直接加ます<br>③ Ⅲ組：する→し、来る→き，要硬背<br>小提醒：「帰る、入る、走る、切る、知る」長得像Ⅱ組，其實是Ⅰ組。",

 {jp:"毎朝、コーヒーを飲みます。",kana:"まいあさ、コーヒーをのみます。",zh:"每天早上喝咖啡。",why:"飲む（Ⅰ組）：む→み＋ます。"},
 {jp:"友達に手紙を書きます。",kana:"ともだちにてがみをかきます。",zh:"寫信給朋友。",why:"書く（Ⅰ組）：く→き＋ます。"},
 {jp:"明日、早く起きます。",kana:"あした、はやくおきます。",zh:"明天早起。",why:"起きる（Ⅱ組）：去掉る＋ます。"},
 {jp:"友達が家へ来ます。",kana:"ともだちがうちへきます。",zh:"朋友來我家。",why:"来る（Ⅲ組）：来ます，讀作「きます」。"},
 {jp:"毎日、日本語を勉強します。",kana:"まいにち、にほんごをべんきょうします。",zh:"每天念日文。",why:"勉強する（Ⅲ組）：します。"}],
 cmp:"💡 去掉「ます」剩下的部分（書き、食べ）就是下面幾張要用的『ます形』。"},
{no:"25",t:"〜かた",scene:"s25",
 form:"動詞ます形（去ます）＋ 方（かた）<br>（…的方法）",
 explain:"「〜かた」＝<b>做…的方法</b>。把動詞的ます形拿掉ます，加上「方」，就變成名詞。<br>読む→読み方（讀的方法）、作る→作り方（做的方法）。<br>要注意：原本的「を」「に」要改成<b>の</b>：<br>ケーキ<b>を</b>作る → ケーキ<b>の</b>作り方。",
 ex:[
 {jp:"この漢字の読み方を教えてください。",kana:"このかんじのよみかたをおしえてください。",zh:"請教我這個漢字的讀法。",why:"読む→読み＋方；「漢字を読む」的を變成の。"},
 {jp:"箸の使い方が分かりません。",kana:"はしのつかいかたがわかりません。",zh:"我不知道筷子的用法。",why:"使う→使い＋方；分かる的對象用が。"},
 {jp:"電車の乗り方を教えてください。",kana:"でんしゃののりかたをおしえてください。",zh:"請教我怎麼搭電車。",why:"乗る→乗り＋方；「電車に乗る」的に也變成の。"},
 {jp:"ケーキの作り方を知っていますか。",kana:"ケーキのつくりかたをしっていますか。",zh:"你知道蛋糕的做法嗎？",why:"作る→作り＋方；「ケーキを作る」的を變成の。"}],
 cmp:"💡 〜方 是名詞，所以前面的助詞を、に要換成の。"},
{no:"26",t:"〜やすい",scene:"s26",
 form:"動詞ます形（去ます）＋ やすい<br>（容易～、好～）",
 explain:"「やすい」＝<b>容易…／很好…</b>。表示這個動作很容易做：東西好讀、好寫、好走。<br>它的活用和い形容詞一樣：読みやすい→読みやすくない→読みやすかった。<br>也可以表示<b>容易發生</b>的事（風邪をひきやすい＝容易感冒）。",
 ex:[
 {jp:"この本は読みやすいです。",kana:"このほんはよみやすいです。",zh:"這本書很好讀。",why:"読む→読み＋やすい。"},
 {jp:"このペンは書きやすいです。",kana:"このペンはかきやすいです。",zh:"這支筆很好寫。",why:"書く→書き＋やすい。"},
 {jp:"この靴は歩きやすいです。",kana:"このくつはあるきやすいです。",zh:"這雙鞋很好走。",why:"歩く→歩き＋やすい。"},
 {jp:"冬は風邪をひきやすいです。",kana:"ふゆはかぜをひきやすいです。",zh:"冬天容易感冒。",why:"表示『容易發生』的事。"}],
 cmp:"💡 やすい（容易）⇔ にくい（困難），下一張。"},
{no:"27",t:"〜にくい",scene:"s27",
 form:"動詞ます形（去ます）＋ にくい<br>（不容易～、難～）",
 explain:"「にくい」＝<b>不容易…／很難…</b>，是「やすい」的反義。<br>重點：是因為<b>東西本身</b>讓動作難做（字太小、鞋太硬），不是你的能力不足。能力不足要用「難しい」。<br>活用和い形容詞一樣：読みにくい→読みにくくない。",
 ex:[
 {jp:"この漢字は書きにくいです。",kana:"このかんじはかきにくいです。",zh:"這個漢字很難寫。",why:"書く→書き＋にくい。"},
 {jp:"この靴は歩きにくいです。",kana:"このくつはあるきにくいです。",zh:"這雙鞋很難走。",why:"對比上一張「歩きやすい」。"},
 {jp:"田中さんの字は、読みにくいです。",kana:"たなかさんのじは、よみにくいです。",zh:"田中先生的字很難讀。",why:"字本身難讀，用にくい。"},
 {jp:"先生には、ちょっと話しにくいです。",kana:"せんせいには、ちょっとはなしにくいです。",zh:"對老師有點難開口。",why:"心理上不容易做，也可以用にくい。"}],
 cmp:"💡 にくい＝東西本身不好用；難しい＝需要很高的能力或很複雜。"},
{no:"28",t:"〜すぎる",scene:"s28",
 form:"動詞ます形（去ます）＋ すぎる<br>い形容詞（去い）＋ すぎる<br>な形容詞（去な）＋ すぎる",
 explain:"「すぎる」＝<b>太…、…過頭</b>，超過適當的程度，通常是負面的。<br>① 動詞：食べすぎる（吃太多）<br>② い形容詞：甘い→甘すぎる<br>③ な形容詞：静か→静かすぎる<br>活用像Ⅱ組動詞：食べすぎます、食べすぎた。",
 ex:[
 {jp:"食べすぎました。",kana:"たべすぎました。",zh:"吃太多了。",why:"食べる→食べ＋すぎる，過去式すぎました。"},
 {jp:"このケーキは甘すぎます。",kana:"このケーキはあますぎます。",zh:"這個蛋糕太甜了。",why:"い形容詞：甘い→甘＋すぎる。"},
 {jp:"この部屋は静かすぎます。",kana:"このへやはしずかすぎます。",zh:"這個房間太安靜了。",why:"な形容詞：静か→静か＋すぎる。"},
 {jp:"昨日は飲みすぎました。",kana:"きのうはのみすぎました。",zh:"昨天喝太多了。",why:"飲む→飲み＋すぎる。"}],
 cmp:"💡 い形容詞「いい」要特別：いい→よすぎる。"}
]});
UNITS.push({name:"第07單元　動詞ます形Ⅱ",cards:[
{no:"29",t:"〜始める",scene:"s29",
 form:"動詞ます形（去ます）＋ 始める（はじめる）",
 explain:"「〜始める」＝<b>開始做…</b>。一個動作開始了：降り始める（開始下）、食べ始める（開始吃）。<br>可以是自然開始，也可以是按計畫開始。<br>活用像Ⅱ組動詞：降り始めます、降り始めました。",
 ex:[
 {jp:"雨が降り始めました。",kana:"あめがふりはじめました。",zh:"開始下雨了。",why:"降る→降り＋始める。"},
 {jp:"九時から勉強し始めます。",kana:"くじからべんきょうしはじめます。",zh:"從九點開始念書。",why:"勉強する→勉強し＋始める。"},
 {jp:"赤ちゃんが歩き始めました。",kana:"あかちゃんがあるきはじめました。",zh:"小嬰兒開始走路了。",why:"歩く→歩き＋始める。"},
 {jp:"去年から日本語を習い始めました。",kana:"きょねんからにほんごをならいはじめました。",zh:"從去年開始學日文。",why:"習う→習い＋始める。"}],
 cmp:"💡 始める＝開始；出す＝突然開始（下一張）。"},
{no:"30",t:"〜出す",scene:"s30",
 form:"動詞ます形（去ます）＋ 出す（だす）",
 explain:"「〜出す」＝<b>突然開始…</b>，常帶著『沒想到！』的驚訝感。<br>降り出す（突然下起來）、泣き出す（突然哭起來）。<br>因為是『突然』，通常不用在自己事先計畫好的動作，也不用在提議（〜出しましょう）。",
 ex:[
 {jp:"急に雨が降り出しました。",kana:"きゅうにあめがふりだしました。",zh:"突然下起雨來。",why:"急に＝突然，搭配〜出す。"},
 {jp:"赤ちゃんが急に泣き出しました。",kana:"あかちゃんがきゅうになきだしました。",zh:"小嬰兒突然哭了起來。",why:"泣く→泣き＋出す。"},
 {jp:"彼女は突然笑い出しました。",kana:"かのじょはとつぜんわらいだしました。",zh:"她突然笑了出來。",why:"笑う→笑い＋出す。"},
 {jp:"犬が走り出しました。",kana:"いぬがはしりだしました。",zh:"狗突然跑了起來。",why:"走る→走り＋出す。"}],
 cmp:"💡 始める＝一般的開始；出す＝突然開始。"},
{no:"31",t:"〜続ける",scene:"s31",
 form:"動詞ます形（去ます）＋ 続ける（つづける）",
 explain:"「〜続ける」＝<b>持續…、一直…</b>。同一個動作一直沒有停：勉強し続ける（一直念書）、降り続ける（一直下）。<br>常和時間量一起用：三日間、一時間。",
 ex:[
 {jp:"毎日、日本語を勉強し続けます。",kana:"まいにち、にほんごをべんきょうしつづけます。",zh:"每天持續學日文。",why:"勉強する→勉強し＋続ける。"},
 {jp:"雨が三日間降り続けました。",kana:"あめがみっかかんふりつづけました。",zh:"雨一直下了三天。",why:"降る→降り＋続ける，搭配時間量三日間。"},
 {jp:"彼は走り続けました。",kana:"かれははしりつづけました。",zh:"他一直跑下去。",why:"走る→走り＋続ける。"},
 {jp:"先生は一時間話し続けました。",kana:"せんせいはいちじかんはなしつづけました。",zh:"老師講了一個小時。",why:"話す→話し＋続ける。"}],
 cmp:"💡 始める（開始）→続ける（持續）→終わる（結束），三兄弟一起記。"},
{no:"32",t:"〜終わる",scene:"s32",
 form:"動詞ます形（去ます）＋ 終わる（おわる）",
 explain:"「〜終わる」＝<b>做完…</b>。動作到這裡結束：読み終わる（讀完）、食べ終わる（吃完）。<br>前面通常是『有結束點』的動作（讀一本書、吃一頓飯、看一部電影）。",
 ex:[
 {jp:"本を読み終わりました。",kana:"ほんをよみおわりました。",zh:"書讀完了。",why:"読む→読み＋終わる。"},
 {jp:"晩ご飯を食べ終わりました。",kana:"ばんごはんをたべおわりました。",zh:"吃完晚飯了。",why:"食べる→食べ＋終わる。"},
 {jp:"レポートを書き終わりました。",kana:"レポートをかきおわりました。",zh:"報告寫完了。",why:"書く→書き＋終わる。"},
 {jp:"映画を見終わりました。",kana:"えいがをみおわりました。",zh:"電影看完了。",why:"見る→見＋終わる。"}],
 cmp:"💡 〜終わる只是『結束』；之後會學的〜てしまう也有『完成』的意思，但帶有感情。"}
]});
UNITS.push({name:"第08單元　動詞ない形",cards:[
{no:"33",t:"〜ない形",scene:"s33",
 form:"Ⅰ組：最後一個假名 う段 → あ段＋ない　書く→書かない／飲む→飲まない／買う→買わない（う→わ）<br>Ⅱ組：去掉「る」＋ない　食べる→食べない／見る→見ない<br>Ⅲ組：する→しない／来る→来ない（こない）<br>特別：ある→ない",
 explain:"ない形＝動詞的<b>否定</b>（不…），是「〜ません」的普通形。<br>① Ⅰ組：最後一個音換成<b>あ段</b>（く→か、む→ま、す→さ）；<b>「う」結尾要變「わ」</b>（買う→買わない）<br>② Ⅱ組：去掉る＋ない<br>③ Ⅲ組：しない、来ない（こない）<br>「ある」的否定很特別：ある→<b>ない</b>（不是あらない）。",
 ex:[
 {jp:"今日は学校へ行かない。",kana:"きょうはがっこうへいかない。",zh:"今天不去學校。",why:"行く（Ⅰ組）：く→か＋ない。"},
 {jp:"朝ごはんを食べない。",kana:"あさごはんをたべない。",zh:"不吃早餐。",why:"食べる（Ⅱ組）：去る＋ない。"},
 {jp:"友達は来ない。",kana:"ともだちはこない。",zh:"朋友不來。",why:"来る（Ⅲ組）：来ない，讀作「こない」。"},
 {jp:"私はお酒を飲まない。",kana:"わたしはおさけをのまない。",zh:"我不喝酒。",why:"飲む（Ⅰ組）：む→ま＋ない。"}],
 cmp:"💡 ない形是『普通形的否定』，後面還會接なければならない、ないでください等。"},
{no:"34",t:"〜ないでください",scene:"s34",
 form:"動詞ない形 ＋ で ＋ ください（請不要…）",
 explain:"「〜ないでください」＝<b>請不要…</b>，客氣的禁止。<br>ない形（書かない）＋でください → 書かないでください。<br>語氣是『請求』，比命令（行くな）溫和。",
 ex:[
 {jp:"ここで写真を撮らないでください。",kana:"ここでしゃしんをとらないでください。",zh:"請不要在這裡拍照。",why:"撮る→撮らない＋でください。"},
 {jp:"授業中は、話さないでください。",kana:"じゅぎょうちゅうは、はなさないでください。",zh:"上課中請不要說話。",why:"話す→話さない＋でください。"},
 {jp:"心配しないでください。",kana:"しんぱいしないでください。",zh:"請不要擔心。",why:"心配する→心配しない＋でください。"},
 {jp:"忘れないでください。",kana:"わすれないでください。",zh:"請不要忘記。",why:"忘れる→忘れない＋でください。"}],
 cmp:"💡 反過來『請做…』是〜てください（後面會學）。"},
{no:"35",t:"〜なければならない",scene:"s35",
 form:"動詞ない形（去い）＋ ければならない（必須…）<br>書かない → 書かなければならない",
 explain:"「〜なければならない」＝<b>必須…、一定要…</b>。把「ない」的「い」換成「ければならない」。<br>書かない → 書かな<b>ければならない</b>。<br>語氣偏<b>正式、有義務</b>（規定、責任）。<br>口語常省略成「〜なきゃ」。",
 ex:[
 {jp:"明日は早く起きなければなりません。",kana:"あしたははやくおきなければなりません。",zh:"明天必須早起。",why:"起きる→起きない→起きなければならない。"},
 {jp:"毎日、日本語を勉強しなければなりません。",kana:"まいにち、にほんごをべんきょうしなければなりません。",zh:"每天都必須念日文。",why:"勉強する→勉強しない→勉強しなければならない。"},
 {jp:"宿題をしなければなりません。",kana:"しゅくだいをしなければなりません。",zh:"必須做功課。",why:"する→しない→しなければならない。"},
 {jp:"駅まで走らなければなりません。",kana:"えきまではしらなければなりません。",zh:"必須跑到車站。",why:"走る（Ⅰ組）→走らない→走らなければならない。"}],
 cmp:"💡 意思和〜なくてはいけない相同，下一張。"},
{no:"36",t:"〜なくてはいけない",scene:"s36",
 form:"動詞ない形（去い）＋ くてはいけない（必須…）<br>書かない → 書かなくてはいけない",
 explain:"「〜なくてはいけない」＝<b>必須…</b>，和「〜なければならない」意思相同，<b>更口語</b>。<br>變法：ない的「い」換成「くてはいけない」。<br>口語常說成「〜なくちゃ」。",
 ex:[
 {jp:"明日までにレポートを出さなくてはいけません。",kana:"あしたまでにレポートをださなくてはいけません。",zh:"必須在明天以前交報告。",why:"出す→出さない→出さなくてはいけない。"},
 {jp:"子どもは早く寝なくてはいけません。",kana:"こどもははやくねなくてはいけません。",zh:"小孩必須早睡。",why:"寝る→寝ない→寝なくてはいけない。"},
 {jp:"もう帰らなくてはいけません。",kana:"もうかえらなくてはいけません。",zh:"我該回去了。",why:"帰る（Ⅰ組）→帰らない→帰らなくてはいけない。"},
 {jp:"パスポートを持っていかなくてはいけません。",kana:"パスポートをもっていかなくてはいけません。",zh:"必須帶護照去。",why:"持っていく→持っていかない→持っていかなくてはいけない。"}],
 cmp:"💡 なければならない（偏正式）＝ なくてはいけない（偏口語）。"},
{no:"37",t:"〜なくてもいい",scene:"s37",
 form:"動詞ない形（去い）＋ くてもいい（不用…也可以）",
 explain:"「〜なくてもいい」＝<b>不用…也可以／不必…</b>。<br>變法：ない的「い」換成「くてもいい」。<br>前面兩張是『必須』，這張是『不必』，意思剛好相反。",
 ex:[
 {jp:"明日は来なくてもいいです。",kana:"あしたはこなくてもいいです。",zh:"明天不用來也可以。",why:"来る→来ない→来なくてもいい。"},
 {jp:"靴を脱がなくてもいいです。",kana:"くつをぬがなくてもいいです。",zh:"不用脫鞋也可以。",why:"脱ぐ→脱がない→脱がなくてもいい。"},
 {jp:"今日は宿題をしなくてもいいです。",kana:"きょうはしゅくだいをしなくてもいいです。",zh:"今天不用做功課也可以。",why:"する→しない→しなくてもいい。"},
 {jp:"急がなくてもいいですよ。",kana:"いそがなくてもいいですよ。",zh:"不用急也沒關係喔。",why:"急ぐ→急がない→急がなくてもいい。"}],
 cmp:"💡 必須＝なければならない；不必＝なくてもいい。"}
]});
UNITS.push({name:"第09單元　動詞て形Ⅰ",cards:[
{no:"38",t:"〜て形",scene:"s38",
 form:"Ⅰ組：<br>く→いて（書く→書いて）※行く→行って<br>ぐ→いで（泳ぐ→泳いで）<br>す→して（話す→話して）<br>う・つ・る→って（買う→買って／待つ→待って／帰る→帰って）<br>ぬ・ぶ・む→んで（飲む→飲んで／遊ぶ→遊んで）<br>Ⅱ組：去る＋て（食べる→食べて）<br>Ⅲ組：して、来て（きて）",
 explain:"て形＝<b>把動作串起來</b>的形。後面要學的〜てもいい、〜ている、〜てある…全部要先會て形。<br>用法一：<b>〜て、〜て、〜</b>＝先做這個，再做那個（依序）。<br>Ⅰ組變法看<b>最後一個假名</b>，唸口訣：<br>「く→いて」「ぐ→いで」「す→して」「う・つ・る→って」「ぬ・ぶ・む→んで」。<br>例外：行く→行って。",
 ex:[
 {jp:"朝起きて、顔を洗って、ご飯を食べます。",kana:"あさおきて、かおをあらって、ごはんをたべます。",zh:"早上起床、洗臉、吃飯。",why:"起きる→起きて；洗う→洗って（う→って）。"},
 {jp:"駅まで歩いて行きます。",kana:"えきまであるいていきます。",zh:"走路去車站。",why:"歩く→歩いて（く→いて）。"},
 {jp:"本を読んで、寝ます。",kana:"ほんをよんで、ねます。",zh:"看完書就睡覺。",why:"読む→読んで（む→んで）。"},
 {jp:"友達と会って、映画を見ました。",kana:"ともだちとあって、えいがをみました。",zh:"和朋友見面，然後看了電影。",why:"会う→会って（う→って）。"}],
 cmp:"💡 時態只寫在最後一個動詞：朝起きて、ご飯を食べました（兩個動作都在過去）。"},
{no:"39",t:"〜てもいい",scene:"s39",
 form:"動詞て形 ＋ もいい（可以…）<br>動詞て形 ＋ もいいですか（可以…嗎？）",
 explain:"「〜てもいい」＝<b>可以…</b>，表示允許。<br>問句「〜てもいいですか」＝<b>可以…嗎？</b>，用來請求許可。<br>回答：はい、どうぞ／いいですよ（可以）；すみません、ちょっと…（委婉拒絕）。",
 ex:[
 {jp:"ここで写真を撮ってもいいですか。",kana:"ここでしゃしんをとってもいいですか。",zh:"可以在這裡拍照嗎？",why:"撮る→撮って＋もいいですか。"},
 {jp:"「入ってもいいですか。」<br>「はい、どうぞ。」",kana:"はいってもいいですか。／はい、どうぞ。",zh:"「可以進去嗎？」「請進。」",why:"入る→入って＋もいいですか。"},
 {jp:"このケーキを食べてもいいですよ。",kana:"このケーキをたべてもいいですよ。",zh:"這個蛋糕可以吃喔。",why:"食べる→食べて＋もいいです。"},
 {jp:"座ってもいいですか。",kana:"すわってもいいですか。",zh:"可以坐嗎？",why:"座る→座って＋もいいですか。"}],

/* ===== 畫面 ===== */
const pager=document.getElementById('pager'),pinfo=document.getElementById('pinfo'),prevB=document.getElementById('prevB'),nextB=document.getElementById('nextB');
const list=document.getElementById('list'),nav=document.getElementById('nav'),q=document.getElementById('q');
let unitFilter=-1;
let cur=0,flat=[];
function build(){
  const kw=q.value.trim().toLowerCase();flat=[];
  UNITS.forEach((u,ui)=>{if(unitFilter>=0&&unitFilter!==ui)return;
    u.cards.forEach(c=>{const blob=(c.no+c.t+c.form+c.explain+c.cmp+c.ex.map(e=>e.jp+e.kana+e.zh+e.why).join('')).toLowerCase();
      if(!kw||blob.includes(kw))flat.push({u:u.name,c});});});
  if(cur>=flat.length)cur=0;
}
function render(){
  const c0=flat[cur];
  if(!c0){list.innerHTML='<div class="empty">找不到 🥲</div>';pager.style.visibility='hidden';return}
  pager.style.visibility='visible';
  const c=c0.c;
  list.innerHTML=`<div class="unit">${c0.u}</div><section class="card" id="c${c.no}">
    <div class="top"><span class="no">${c.no}</span><span class="title">${c.t}</span></div>
    <div class="scene" title="點一下重播" onclick="replay(this)">${SCENES[c.scene]}</div>
    <div class="sec"><span class="lab">接續</span><div class="formula">${c.form}</div></div>
    <div class="sec"><span class="lab">白話拆解</span><div class="explain">${c.explain}</div></div>
    <div class="sec"><span class="lab">例句</span> <span class="hint">（點句子看讀音＋拆解）</span>
    ${c.ex.map(e=>`<div class="ex" onclick="this.classList.toggle('open')"><div class="jp">${e.jp}</div><div class="zh">${e.zh}</div><div class="more">${e.kana}<br>👉 ${e.why}</div></div>`).join('')}</div>
    <div class="cmp">${c.cmp}</div></section>`;
  pinfo.textContent=`${c.no}　(${cur+1} / ${flat.length})`;
  prevB.disabled=cur===0;nextB.disabled=cur===flat.length-1;
  window.scrollTo(0,0);
}
function go(d){const n=cur+d;if(n<0||n>=flat.length)return;cur=n;render()}
function replay(el){const s=el.innerHTML;el.innerHTML='';void el.offsetWidth;el.innerHTML=s}
function buildNav(){
  nav.innerHTML='<button class="on" data-u="-1">全部</button>'+UNITS.map((u,i)=>`<button data-u="${i}">${u.name.replace('第','').replace('單元','').trim()}</button>`).join('');
  nav.onclick=e=>{const b=e.target.closest('button');if(!b)return;unitFilter=+b.dataset.u;cur=0;[...nav.children].forEach(x=>x.classList.toggle('on',x===b));build();render()};
}
q.oninput=()=>{cur=0;build();render()};
prevB.onclick=()=>go(-1);nextB.onclick=()=>go(1);
document.addEventListener('keydown',e=>{if(e.target===q)return;if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1)});
let tx=null;document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)>70)go(d<0?1:-1)});
buildNav();build();render();
</script>
