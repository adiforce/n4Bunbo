<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>穩紮穩打 N4 文法小卡</title>
<style>
:root{--bg:#fff7fa;--card:#fff;--pink:#ffd6e5;--mint:#d4f3e6;--sky:#d6ebff;--lemon:#fff3c4;--coral:#ff6b4a;--ink:#4a3f47}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}
header{padding:14px 16px 8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:760px;margin:auto}
header h1{font-size:18px;margin:0;flex:1 1 auto}
#q{flex:1 1 160px;padding:9px 14px;border:2px solid var(--pink);border-radius:999px;font-size:15px;outline:none;background:#fff}
#q:focus{border-color:var(--coral)}
#nav{max-width:760px;margin:0 auto;padding:0 16px 8px;display:flex;gap:6px;flex-wrap:wrap}
#nav button{border:0;background:var(--pink);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
#nav button.on{background:var(--coral);color:#fff}
main{max-width:760px;margin:auto;padding:8px 16px 60px}
.unit{font-size:14px;color:#a07c8d;margin:18px 0 8px;font-weight:700}
.card{background:var(--card);border-radius:22px;box-shadow:0 4px 0 var(--pink);margin-bottom:22px;overflow:hidden;border:2px solid var(--pink)}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px 0}
.no{background:var(--lemon);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.title{font-size:26px;font-weight:800;color:var(--coral)}
.scene{position:relative;height:130px;margin:10px 14px;border-radius:16px;background:linear-gradient(var(--sky) 0 72%,var(--mint) 72%);overflow:hidden;cursor:pointer}
.scene .e{position:absolute;font-size:38px;line-height:1}
.scene .g{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:11px;background:#fff9;border-radius:99px;padding:1px 8px}
.pop{position:absolute;background:var(--coral);color:#fff;font-weight:800;border-radius:12px;padding:2px 10px;font-size:20px}
.sec{padding:0 16px 10px}
.lab{display:inline-block;font-size:12px;font-weight:700;background:var(--sky);border-radius:8px;padding:1px 8px;margin-bottom:4px}
.formula{font-size:16px;line-height:1.7;background:var(--lemon);border-radius:12px;padding:6px 12px}
.explain{line-height:1.8;font-size:15px}
.ex{border:2px dashed var(--pink);border-radius:14px;padding:8px 12px;margin:8px 0;cursor:pointer;transition:.15s}
.ex:hover{background:#fff3f8}
.ex .jp{font-size:19px;font-weight:700}
.ex .zh{font-size:14px;margin-top:2px}
.ex .more{display:none;margin-top:6px;font-size:14px;line-height:1.7;background:var(--mint);border-radius:10px;padding:6px 10px}
.ex.open .more{display:block}
.hint{font-size:12px;color:#b08fa0}
.cmp{background:var(--pink);border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.7;margin:0 16px 16px}
.empty{text-align:center;color:#a07c8d;padding:40px}
/* animations */
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
@keyframes wiggle{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}
@keyframes bite{0%,15%{transform:scale(1)}30%{transform:scale(.7)}45%{transform:scale(.7)}60%{transform:scale(.4)}75%,90%{transform:scale(.4);opacity:1}100%{transform:scale(1)}}
@keyframes chew{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
@keyframes walkto{0%{left:6%}70%,100%{left:58%}}
@keyframes land{0%,60%{transform:scale(1)}75%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes drive{0%{left:-20%}100%{left:105%}}
@keyframes bump{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
@keyframes walkr{0%{left:4%}100%{left:60%}}
@keyframes pophop{0%,60%,100%{opacity:0;transform:translateY(6px)}70%,95%{opacity:1;transform:translateY(0)}}
.leg rect{transform-box:fill-box;transform-origin:50% 0}
.kid .l rect{animation:swA .5s ease-in-out infinite}
.kid .r rect{animation:swB .5s ease-in-out infinite}
.kid.still .leg rect{animation:none}
.kid.chew .head{transform-box:fill-box;transform-origin:50% 100%;animation:chew2 .5s ease-in-out infinite}
@keyframes swA{0%,100%{transform:rotate(26deg)}50%{transform:rotate(-26deg)}}
@keyframes swB{0%,100%{transform:rotate(-26deg)}50%{transform:rotate(26deg)}}
@keyframes chew2{0%,100%{transform:rotate(0) translateY(0)}50%{transform:rotate(7deg) translateY(1px)}}
.wig{animation:wig .8s ease-in-out infinite}
@keyframes wig{0%,100%{transform:translateX(0)}50%{transform:translateX(12px)}}
.jump{animation:jump 1s ease-in-out infinite}
@keyframes jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
.apple{transform-box:fill-box;transform-origin:50% 100%;animation:bite2 3s infinite}
@keyframes bite2{0%,10%{transform:scale(1)}30%,40%{transform:scale(.72)}60%,70%{transform:scale(.42)}85%{transform:scale(.42);opacity:1}86%{opacity:0}100%{transform:scale(1);opacity:1}}
.mvni{animation:mvni 3.2s ease-out infinite}
@keyframes mvni{0%{transform:translateX(0)}70%,100%{transform:translateX(190px)}}
.mvhe{animation:mvhe 3.5s linear infinite}
@keyframes mvhe{0%{transform:translateX(0)}100%{transform:translateX(130px)}}
.mvbus{animation:mvbus 4.5s linear infinite}
@keyframes mvbus{0%{transform:translateX(0)}100%{transform:translateX(430px)}}
.bounce{animation:bnc .35s ease-in-out infinite}
@keyframes bnc{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pls 1.2s ease-in-out infinite}
@keyframes pls{0%,100%{transform:translate(0,-50px) scale(1)}50%{transform:translate(0,-50px) scale(1.15)}}
@keyframes popin{0%,60%{opacity:0;transform:translateY(6px)}72%,95%{opacity:1;transform:translateY(0)}100%{opacity:0}}
#pager{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:center;gap:14px;padding:10px;background:#fffc;backdrop-filter:blur(6px);border-top:2px solid var(--pink)}
#pager button{border:0;background:var(--coral);color:#fff;font-size:15px;font-weight:700;border-radius:999px;padding:9px 18px;cursor:pointer}
#pager button:disabled{background:#e8d5de;cursor:default}
#pinfo{font-weight:700;min-width:90px;text-align:center}
main{padding-bottom:90px}
.mvka{animation:mvka 3.6s linear infinite}
@keyframes mvka{0%{transform:translateX(0)}100%{transform:translateX(190px)}}
.mvma{animation:mvma 3.6s ease-out infinite}
@keyframes mvma{0%{transform:translateX(0)}75%,100%{transform:translateX(205px)}}
.grow{transform-box:fill-box;transform-origin:0 50%;animation:growx 3.6s ease-out infinite}
@keyframes growx{0%{transform:scaleX(.02)}75%,100%{transform:scaleX(1)}}
.mvmi{animation:mvmi 3.6s ease-out infinite}
@keyframes mvmi{0%{transform:translateX(0)}60%,100%{transform:translateX(105px)}}
.paper{animation:paperfly 3.6s infinite}
@keyframes paperfly{0%,60%{opacity:0;transform:translate(0,0)}61%{opacity:1;transform:translate(0,0)}72%{opacity:1;transform:translate(34px,-18px)}84%{opacity:1;transform:translate(66px,8px)}85%,100%{opacity:0;transform:translate(66px,8px)}}
.appear{transform-box:fill-box;transform-origin:50% 100%;animation:app 4s infinite backwards}
@keyframes app{0%{transform:scale(0);opacity:0}10%{transform:scale(1.2);opacity:1}16%,84%{transform:scale(1);opacity:1}94%,100%{transform:scale(0);opacity:0}}
.dash{animation:dashm 1s linear infinite}
@keyframes dashm{to{stroke-dashoffset:-12}}
.jump2{animation:jump 1.4s ease-in-out infinite}
.beat{transform-box:fill-box;transform-origin:50% 50%;animation:beat 1.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
@keyframes beatp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.spot{opacity:.5;animation:spotp 1.6s ease-in-out infinite}
@keyframes spotp{0%,100%{opacity:.3}50%{opacity:.7}}
.puff{transform-box:fill-box;transform-origin:50% 50%;animation:puff 2s ease-in-out infinite}
@keyframes puff{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.seq{transform-box:fill-box;transform-origin:50% 100%;animation:seq 4.5s infinite backwards;opacity:0}
@keyframes seq{0%{opacity:0;transform:scale(.5)}5%{opacity:1;transform:scale(1.2)}10%,28%{opacity:1;transform:scale(1)}33%,100%{opacity:0;transform:scale(.5)}}
.giant{transform-box:fill-box;transform-origin:50% 100%;animation:giant 3s ease-in-out infinite}
@keyframes giant{0%{transform:scale(.6)}50%,80%{transform:scale(2.3)}100%{transform:scale(.6)}}
.mvtu{animation:mvtu 7s linear infinite}
@keyframes mvtu{0%{transform:translateX(0)}100%{transform:translateX(170px)}}
.cfall{animation:cfall 4s infinite}
@keyframes cfall{0%,18%{opacity:1;transform:translateY(0)}32%,100%{opacity:0;transform:translateY(26px)}}
.cslide{opacity:0;animation:cslide 4s infinite}
@keyframes cslide{0%,30%{opacity:0;transform:translateX(30px)}42%,88%{opacity:1;transform:translateX(0)}96%,100%{opacity:0;transform:translateX(0)}}
.cin{opacity:0;animation:cin 4s infinite}
@keyframes cin{0%,20%{opacity:0;transform:translateY(-22px)}34%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}
.seq4{opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:seq4 6s infinite backwards}
@keyframes seq4{0%{opacity:0;transform:scale(.6)}4%{opacity:1;transform:scale(1.1)}8%,22%{opacity:1;transform:scale(1)}26%,100%{opacity:0;transform:scale(.6)}}
.mvroll{animation:mvroll 3s linear infinite}
@keyframes mvroll{from{transform:translateX(0)}to{transform:translateX(190px)}}
.rot{transform-box:fill-box;transform-origin:50% 50%;animation:spin .9s linear infinite}
.push{animation:push 6s linear infinite}
@keyframes push{from{transform:translateX(0)}to{transform:translateX(22px)}}
.rotslow{transform-box:fill-box;transform-origin:50% 50%;animation:rot53 6s linear infinite}
@keyframes rot53{to{transform:rotate(53deg)}}
.drop{opacity:0;stroke:#5aa0ff;stroke-width:3;stroke-linecap:round;animation:drop 1s linear infinite}
@keyframes drop{0%{opacity:0;transform:translateY(0)}8%{opacity:1}90%{opacity:1}100%{opacity:0;transform:translateY(50px)}}
.dash2cat{animation:dash2 3.2s ease-in infinite}
@keyframes dash2{0%,40%{transform:translateX(0)}62%,100%{transform:translateX(150px)}}
.excl{opacity:0;animation:excl 3.2s infinite}
@keyframes excl{0%,34%{opacity:0;transform:translateY(4px)}40%,56%{opacity:1;transform:translateY(0)}62%,100%{opacity:0}}
.mvtu2{animation:mvtu2 9s linear infinite}
@keyframes mvtu2{from{transform:translateX(0)}to{transform:translateX(165px)}}
.mvfast{animation:mvfast 2.6s ease-out infinite}
@keyframes mvfast{0%{transform:translateX(0)}80%,100%{transform:translateX(205px)}}
.hand{transform-origin:0 0;animation:spin .9s linear infinite}
.zz{opacity:0;animation:zz 3s infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(14px,-26px)}}
.chk{opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:chk 3s infinite}
@keyframes chk{0%,80%{opacity:0;transform:scale(.4)}88%{opacity:1;transform:scale(1.3)}95%,100%{opacity:1;transform:scale(1)}}
.nib{transform-box:fill-box;transform-origin:50% 100%;animation:nib 3s infinite}
@keyframes nib{0%,20%{transform:scale(1)}40%,70%{transform:scale(.8)}100%{transform:scale(1)}}
.tofr{animation:tofr 3.4s ease-in-out infinite}
@keyframes tofr{0%,10%{opacity:1;transform:translate(0,0) scale(1)}60%{opacity:1;transform:translate(120px,-26px) scale(.9)}85%{opacity:1;transform:translate(166px,-22px) scale(.55)}95%,100%{opacity:0;transform:translate(166px,-22px) scale(.4)}}
.vanish{transform-box:fill-box;transform-origin:50% 100%;animation:vanish 3.4s infinite}
@keyframes vanish{0%,20%{opacity:1;transform:scale(1)}32%,92%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
.mvrain{animation:mvrain 6s linear infinite}
@keyframes mvrain{from{transform:translateX(0)}to{transform:translateX(170px)}}
.tcome{animation:tcome 3s ease-out infinite}
@keyframes tcome{0%{transform:translateX(0)}70%,100%{transform:translateX(-135px)}}
.tgo{animation:tgo 3s ease-in infinite}
@keyframes tgo{0%{transform:translateX(0)}80%,100%{transform:translateX(150px)}}
.apple2{transform-box:fill-box;transform-origin:50% 100%;animation:bite3 3s infinite}
@keyframes bite3{0%,10%{transform:scale(1);opacity:1}30%,40%{transform:scale(.72)}60%,85%{transform:scale(.42);opacity:1}88%,99%{transform:scale(.42);opacity:0}100%{transform:scale(1);opacity:1}}
.mvx{animation:mvx var(--t,3.2s) ease-in-out infinite}
@keyframes mvx{0%,12%{transform:translateX(0)}72%,100%{transform:translateX(var(--dx,100px))}}
.swapA{animation:swA2 4s infinite}.swapB{animation:swB2 4s infinite}
@keyframes swA2{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}
@keyframes swB2{0%,45%{opacity:0}50%,95%{opacity:1}100%{opacity:0}}
.doorp{transform-box:fill-box;transform-origin:0 50%;animation:doorp 4s ease-in-out infinite}
@keyframes doorp{0%,25%{transform:scaleX(1)}50%,90%{transform:scaleX(.3)}100%{transform:scaleX(1)}}
.flick{animation:flick 1.3s steps(1) infinite}
@keyframes flick{0%{fill:#9fd8ff}50%{fill:#ffe9a8}}
.bow{transform-box:fill-box;transform-origin:50% 100%;animation:bow 2.6s ease-in-out infinite}
@keyframes bow{0%,20%,100%{transform:rotate(0)}45%,75%{transform:rotate(20deg)}}
.shake{animation:shake .4s linear infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.grow2{transform-box:fill-box;transform-origin:50% 100%;animation:grow2 3.5s ease-in-out infinite}
@keyframes grow2{0%,10%{transform:scale(.5)}70%,100%{transform:scale(1.4)}}
.pin{opacity:0;animation:popin 3.2s infinite}
.press{animation:press 4s infinite}
@keyframes press{0%,45%{transform:translateY(0)}50%,95%{transform:translateY(4px)}100%{transform:translateY(0)}}
.scene .g{white-space:nowrap}
#sbox{position:relative;flex:1 1 160px;display:flex}
#sbox #q{width:100%}
#sug{position:absolute;top:100%;left:0;right:0;margin-top:6px;background:#fff;border:2px solid var(--pink);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:340px;overflow:auto;z-index:50}
#sug[hidden]{display:none}
#sug .it{padding:9px 14px;cursor:pointer;border-bottom:1px solid #fff0f5;font-size:14px;display:flex;flex-direction:column;gap:2px}
#sug .it:last-child{border-bottom:0}
#sug .it:hover,#sug .it.act{background:var(--pink)}
#sug .it b{color:var(--coral);margin-right:6px}
#sug .it small{color:#8a7a84;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sug mark{background:var(--lemon);color:inherit;border-radius:3px}
#sug .none{padding:12px 14px;color:#8a7a84;font-size:13px}
#navbar{max-width:760px;margin:0 auto;padding:0 16px 8px}
#navT{border:0;background:var(--mint);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;color:var(--ink)}
#nav[hidden]{display:none}
@keyframes kwalk{0%,6%{transform:translateX(0)}42%,100%{transform:translateX(32px)}}@keyframes doorp2{0%,50%{transform:scaleX(1)}60%,90%{transform:scaleX(.3)}100%{transform:scaleX(1)}}.kwalk{animation:kwalk 4s ease-in-out infinite}.kv1{animation:kv1 4s infinite}.kv2{opacity:0;animation:kv2 4s infinite}@keyframes kv1{0%,42%{opacity:1}43%,100%{opacity:0}}@keyframes kv2{0%,42%{opacity:0}43%,100%{opacity:1}}.d2 .doorp{animation:doorp2 4s ease-in-out infinite}
.kid .arm{transform-box:fill-box;transform-origin:50% 0}
.kid .al{animation:armA .5s ease-in-out infinite}.kid .ar{animation:armB .5s ease-in-out infinite}
.kid.still .arm{animation:none}
.kid.reach .ar{animation:aReach 1.8s ease-in-out infinite}
.kid.wave .ar{animation:aWave .7s ease-in-out infinite}
.kid.give .ar{animation:aGive 2.4s ease-in-out infinite}
.kid.eat .ar{animation:aEat 1.1s ease-in-out infinite}
.kid.cheer .ar{animation:aCheerR .6s ease-in-out infinite}.kid.cheer .al{animation:aCheerL .6s ease-in-out infinite}
.kid.write .ar{animation:aWrite .5s ease-in-out infinite}
.kid.think .ar{animation:none;transform:rotate(-150deg)}
.kid.k78 .ar{animation:aK78 4s ease-in-out infinite}
@keyframes armA{0%,100%{transform:rotate(22deg)}50%{transform:rotate(-22deg)}}
@keyframes armB{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(22deg)}}
@keyframes aReach{0%,100%{transform:rotate(0)}15%{transform:rotate(-86deg)}30%{transform:rotate(-76deg)}45%{transform:rotate(-88deg)}60%{transform:rotate(-76deg)}75%{transform:rotate(-86deg)}90%{transform:rotate(0)}}
@keyframes aWave{0%,100%{transform:rotate(-145deg)}50%{transform:rotate(-105deg)}}
@keyframes aGive{0%,100%{transform:rotate(0)}20%,80%{transform:rotate(-82deg)}}
@keyframes aEat{0%,100%{transform:translate(0,0) rotate(-30deg) scaleY(1)}40%,60%{transform:translate(0,0) rotate(167deg) scaleY(.66)}}
@keyframes aCheerR{0%,100%{transform:rotate(-165deg)}50%{transform:rotate(-135deg)}}
@keyframes aCheerL{0%,100%{transform:rotate(165deg)}50%{transform:rotate(135deg)}}
@keyframes aWrite{0%,100%{transform:rotate(-55deg)}50%{transform:rotate(-70deg)}}

.kid.cross .al{animation:none;transform:rotate(-66deg) scaleY(1.65)}.kid.cross .ar{animation:none;transform:rotate(66deg) scaleY(1.65)}

.drip{animation:drip 1.1s ease-in infinite}

</head>
<body>
<header>
  <h1>🌸 穩紮穩打 N4 文法小卡</h1>
  <div id="sbox"><input id="q" placeholder="搜尋：が、吃、地點、方向…" autocomplete="off"><div id="sug" hidden></div></div>
</header>
<div id="navbar"><button id="navT" type="button"></button></div>
<div id="nav" hidden></div>
<main id="list"></main>
<div id="pager"><button id="prevB">◀ 上一個</button><span id="pinfo"></span><button id="nextB">下一個 ▶</button></div>

<script>
/* ===== 場景模板（共用動畫，每張卡只選一個） ===== */
const KID=(cls='')=>`<g class="kid ${cls}">
<g class="leg l"><rect x="-8" y="22" width="7" height="17" rx="3.5" fill="#f2c4a0"/><ellipse cx="-3" cy="40" rx="6.5" ry="3.2" fill="#fff" stroke="#e0c9d4" stroke-width="1"/></g>
<g class="leg r"><rect x="1" y="22" width="7" height="17" rx="3.5" fill="#f2c4a0"/><ellipse cx="6" cy="40" rx="6.5" ry="3.2" fill="#fff" stroke="#e0c9d4" stroke-width="1"/></g>
<rect x="-12" y="3" width="24" height="24" rx="9" fill="#fff" stroke="#4a3f47" stroke-width="1.8"/>
<path d="M-13 21 H13 L14 31 Q14 33 12 33 H2 L0 27 L-2 33 H-12 Q-14 33 -14 31Z" fill="#ff9a3c"/>
<g transform="translate(-12,9)"><g class="arm al"><rect x="-2.6" y="0" width="5.2" height="13" rx="2.6" fill="#f2c4a0"/><circle cx="0" cy="14" r="3.3" fill="#f2c4a0"/></g></g><g class="head">
<g fill="#5a3d2e"><circle cx="-2" cy="-16" r="20"/><circle cx="-2" cy="-36" r="8"/><circle cx="-15" cy="-31" r="8"/><circle cx="12" cy="-31" r="8"/><circle cx="-22" cy="-18" r="8"/><circle cx="-19" cy="-5" r="7"/><circle cx="20" cy="-20" r="7"/></g>
<circle cx="2" cy="-9" r="16.5" fill="#ffe1c9"/>
<circle cx="9" cy="-10" r="2.4" fill="#4a3f47"/><circle cx="13" cy="-3" r="2.8" fill="#ff9aa8" opacity=".75"/>
<path d="M6 -1 Q9 3 12 -1" stroke="#4a3f47" fill="none" stroke-width="1.5" stroke-linecap="round"/></g><g transform="translate(12,9)"><g class="arm ar"><rect x="-2.6" y="0" width="5.2" height="13" rx="2.6" fill="#f2c4a0"/><circle cx="0" cy="14" r="3.3" fill="#f2c4a0"/></g></g></g>`;
const CAT=`<g><path d="M20 22 Q42 14 35 -4" stroke="#ffa24d" stroke-width="7" fill="none" stroke-linecap="round"/>
<path d="M33 16 L38 12 M37 6 L42 4 M36 -1 L41 -3" stroke="#d9691a" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="0" cy="18" rx="21" ry="15" fill="#ffa24d"/>
<path d="M-12 6 L-6 12 M-4 4 L-1 11 M5 4 L3 11 M13 7 L8 12" stroke="#d9691a" stroke-width="3" stroke-linecap="round"/>
<circle cx="0" cy="-5" r="17" fill="#ffa24d"/>

UNITS.push({name:"第03單元　助詞Ⅲ",cards:[

 ex:[
 {jp:"私は台湾人です。",kana:"わたしはたいわんじんです。",zh:"我是台灣人。",why:"先打光在「私」身上，再說明他是誰。"},

 {jp:"肉は食べますが、魚は食べません。",kana:"にくはたべますが、さかなはたべません。",zh:"肉吃，但是魚不吃。",why:"兩個は並排＝對比：這個可以，那個不行。（食べる的を被は取代）"},

{no:"13",t:"〜でも",scene:"dm",

UNITS.push({name:"第04單元　比較・程度",cards:[

UNITS.push({name:"第05單元　指示",cards:[

{no:"23",t:"こう／そう／ああ",scene:"ko",

UNITS.push({name:"第06單元　動詞ます形Ⅰ",cards:[
{no:"24",t:"〜ます形",scene:"s24",
 form:"Ⅰ組：最後一個假名 う段 → い段　書く→書きます／飲む→飲みます／話す→話します<br>Ⅱ組：去掉「る」　食べる→食べます／見る→見ます<br>Ⅲ組：する→します／来る（くる）→来ます（きます）",
 explain:"「ます形」＝動詞加上<b>ます</b>的禮貌說法；去掉「ます」剩下的部分（書き、食べ）是之後很多句型的<b>底座</b>（〜たい、〜やすい、〜すぎる、〜始める…）。<br>三組動詞變法不同：<br>① Ⅰ組：最後一個音換成<b>い段</b>（く→き、む→み、す→し）<br>② Ⅱ組：<b>去掉る</b>，直接加ます<br>③ Ⅲ組：する→し、来る→き，要硬背<br>小提醒：「帰る、入る、走る、切る、知る」長得像Ⅱ組，其實是Ⅰ組。",
 ex:[
 {jp:"毎朝、コーヒーを飲みます。",kana:"まいあさ、コーヒーをのみます。",zh:"每天早上喝咖啡。",why:"飲む（Ⅰ組）：む→み＋ます。"},
 {jp:"友達に手紙を書きます。",kana:"ともだちにてがみをかきます。",zh:"寫信給朋友。",why:"書く（Ⅰ組）：く→き＋ます。"},
 {jp:"明日、早く起きます。",kana:"あした、はやくおきます。",zh:"明天早起。",why:"起きる（Ⅱ組）：去掉る＋ます。"},
 {jp:"友達が家へ来ます。",kana:"ともだちがうちへきます。",zh:"朋友來我家。",why:"来る（Ⅲ組）：来ます，讀作「きます」。"},
 {jp:"毎日、日本語を勉強します。",kana:"まいにち、にほんごをべんきょうします。",zh:"每天念日文。",why:"勉強する（Ⅲ組）：します。"}],
 cmp:"💡 去掉「ます」剩下的部分（書き、食べ）就是下面幾張要用的『ます形』。"},
{no:"25",t:"〜かた",scene:"s25",

 explain:"「〜かた」＝<b>做…的方法</b>。把動詞的ます形拿掉ます，加上「方」，就變成名詞。<br>読む→読み方（讀的方法）、作る→作り方（做的方法）。<br>要注意：原本的「を」「に」要改成<b>の</b>：<br>ケーキ<b>を</b>作る → ケーキ<b>の</b>作り方。",

 {jp:"箸の使い方が分かりません。",kana:"はしのつかいかたがわかりません。",zh:"我不知道筷子的用法。",why:"使う→使い＋方；分かる的對象用が。"},
 {jp:"電車の乗り方を教えてください。",kana:"でんしゃののりかたをおしえてください。",zh:"請教我怎麼搭電車。",why:"乗る→乗り＋方；「電車に乗る」的に也變成の。"},

{no:"26",t:"〜やすい",scene:"s26",

{no:"27",t:"〜にくい",scene:"s27",

 {jp:"田中さんの字は、読みにくいです。",kana:"たなかさんのじは、よみにくいです。",zh:"田中先生的字很難讀。",why:"字本身難讀，用にくい。"},
 {jp:"先生には、ちょっと話しにくいです。",kana:"せんせいには、ちょっとはなしにくいです。",zh:"對老師有點難開口。",why:"心理上不容易做，也可以用にくい。"}],
 cmp:"💡 にくい＝東西本身不好用；難しい＝需要很高的能力或很複雜。"},
{no:"28",t:"〜すぎる",scene:"s28",

 {jp:"この部屋は静かすぎます。",kana:"このへやはしずかすぎます。",zh:"這個房間太安靜了。",why:"な形容詞：静か→静か＋すぎる。"},
 {jp:"昨日は飲みすぎました。",kana:"きのうはのみすぎました。",zh:"昨天喝太多了。",why:"飲む→飲み＋すぎる。"}],

]});
UNITS.push({name:"第07單元　動詞ます形Ⅱ",cards:[

UNITS.push({name:"第08單元　動詞ない形",cards:[

{no:"38",t:"〜て形",scene:"s38",
 form:"Ⅰ組：<br>く→いて（書く→書いて）※行く→行って<br>ぐ→いで（泳ぐ→泳いで）<br>す→して（話す→話して）<br>う・つ・る→って（買う→買って／待つ→待って／帰る→帰って）<br>ぬ・ぶ・む→んで（飲む→飲んで／遊ぶ→遊んで）<br>Ⅱ組：去掉る＋て（食べる→食べて）<br>Ⅲ組：して、来て（きて）",
 explain:"て形＝<b>把動作串起來</b>的形。後面要學的〜てもいい、〜ている、〜てある…全部要先會て形。<br>用法一：<b>〜て、〜て、〜</b>＝先做這個，再做那個（依序）。<br>Ⅰ組變法看<b>最後一個假名</b>，唸口訣：<br>「く→いて」「ぐ→いで」「す→して」「う・つ・る→って」「ぬ・ぶ・む→んで」。<br>例外：行く→行って。",
 ex:[
 {jp:"朝起きて、顔を洗って、ご飯を食べます。",kana:"あさおきて、かおをあらって、ごはんをたべます。",zh:"早上起床、洗臉、吃飯。",why:"起きる→起きて；洗う→洗って（う→って）。"},
 {jp:"駅まで歩いて行きます。",kana:"えきまであるいていきます。",zh:"走路去車站。",why:"歩く→歩いて（く→いて）。"},
 {jp:"本を読んで、寝ます。",kana:"ほんをよんで、ねます。",zh:"看完書就睡覺。",why:"読む→読んで（む→んで）。"},
 {jp:"友達と会って、映画を見ました。",kana:"ともだちとあって、えいがをみました。",zh:"和朋友見面，然後看了電影。",why:"会う→会って（う→って）。"}],
 cmp:"💡 時態只寫在最後一個動詞：朝起きて、ご飯を食べました（兩個動作都在過去）。"},
{no:"39",t:"〜てもいい",scene:"s39",
 form:"動詞て形 ＋ もいい（可以…）<br>動詞て形 ＋ もいいですか（可以…嗎？）",
 explain:"「〜てもいい」＝<b>可以…</b>，表示允許。<br>問句「〜てもいいですか」＝<b>可以…嗎？</b>，用來請求許可。<br>回答：はい、どうぞ／いいですよ（可以）；すみません、ちょっと…（委婉拒絕）。",
 ex:[
 {jp:"ここで写真を撮ってもいいですか。",kana:"ここでしゃしんをとってもいいですか。",zh:"可以在這裡拍照嗎？",why:"撮る→撮って＋もいいですか。"},
 {jp:"「入ってもいいですか。」<br>「はい、どうぞ。」",kana:"はいってもいいですか。／はい、どうぞ。",zh:"「可以進去嗎？」「請進。」",why:"入る→入って＋もいいですか。"},
 {jp:"このケーキを食べてもいいですよ。",kana:"このケーキをたべてもいいですよ。",zh:"這個蛋糕可以吃喔。",why:"食べる→食べて＋もいいです。"},
 {jp:"座ってもいいですか。",kana:"すわってもいいですか。",zh:"可以坐嗎？",why:"座る→座って＋もいいですか。"}],
 cmp:"💡 不可以＝〜てはいけません（下一張）。"},
{no:"40",t:"〜てはいけない",scene:"s40",
 form:"動詞て形 ＋ はいけない（不可以…）",
 explain:"「〜てはいけない」＝<b>不可以…、禁止…</b>。常用在規則、告示。<br>語氣比較強，對長輩或客人通常改用委婉的說法（例如：ご遠慮ください）。<br>口語會說成「〜ちゃだめ」。",
 ex:[
 {jp:"ここでたばこを吸ってはいけません。",kana:"ここでたばこをすってはいけません。",zh:"這裡不可以抽菸。",why:"吸う→吸って＋はいけません。"},
 {jp:"教室で食べてはいけません。",kana:"きょうしつでたべてはいけません。",zh:"教室裡不可以吃東西。",why:"食べる→食べて＋はいけません。"},
 {jp:"廊下を走ってはいけません。",kana:"ろうかをはしってはいけません。",zh:"走廊上不可以跑步。",why:"走る→走って＋はいけません。"},
 {jp:"夜遅く電話してはいけません。",kana:"よるおそくでんわしてはいけません。",zh:"半夜不可以打電話。",why:"電話する→電話して＋はいけません。"}],
 cmp:"💡 〜てもいい（可以）⇔ 〜てはいけない（不可以）。"},
{no:"41",t:"〜ている",scene:"s41",
 form:"動詞て形 ＋ いる（ている）",
 explain:"「〜ている」有三個常見意思：<br>① <b>正在…</b>（進行中）：本を読んでいる（正在看書）<br>② <b>…著／已經…的狀態</b>（結果狀態）：結婚している（已婚）、窓が開いている（窗戶開著）<br>③ <b>一直在…</b>（習慣・職業）：銀行で働いている（在銀行工作）、台湾に住んでいる（住在台灣）<br>判斷：動作有『持續過程』→進行；動作瞬間完成→結果狀態。",
 ex:[
 {jp:"今、本を読んでいます。",kana:"いま、ほんをよんでいます。",zh:"現在正在看書。",why:"進行中：読む→読んで＋います。"},
 {jp:"山田さんは結婚しています。",kana:"やまださんはけっこんしています。",zh:"山田先生已婚。",why:"結果狀態：結了婚，現在的狀態是已婚。"},
 {jp:"兄は銀行で働いています。",kana:"あにはぎんこうではたらいています。",zh:"哥哥在銀行工作。",why:"持續的狀態、職業。"},
 {jp:"窓が開いています。",kana:"まどがあいています。",zh:"窗戶是開著的。",why:"自動詞：看到的狀態。"},
 {jp:"私は台湾に住んでいます。",kana:"わたしはたいわんにすんでいます。",zh:"我住在台灣。",why:"持續的狀態：住んでいる。"}],
 cmp:"💡 住んでいる、知っている、結婚している 是『狀態』，不是『正在』。"},
{no:"42",t:"〜てある",scene:"s42",
 form:"他動詞て形 ＋ ある<br>物 ＋ が ＋ 他動詞て形＋ある",
 explain:"「〜てある」＝<b>有人（為了某個目的）事先做好，結果的狀態留在那裡</b>。<br>例：窓が開けてある（有人把窗戶打開，現在是開著的）。<br>重點：<br>① 前面是<b>他動詞</b>（開ける、置く、書く、入れる）<br>② 東西通常用<b>が</b><br>③ 看得到那個結果。<br>對照：窓が開いている（自然開著）／窓が開けてある（有人打開的）。",
 ex:[
 {jp:"窓が開けてあります。",kana:"まどがあけてあります。",zh:"窗戶（有人）打開著。",why:"開ける（他動詞）→開けてある，有人打開的結果。"},
 {jp:"机の上に本が置いてあります。",kana:"つくえのうえにほんがおいてあります。",zh:"桌上放著書。",why:"置く→置いてある，有人放好的。"},
 {jp:"黒板に名前が書いてあります。",kana:"こくばんになまえがかいてあります。",zh:"黑板上寫著名字。",why:"書く→書いてある，寫好的結果。"},
 {jp:"冷蔵庫にケーキが入れてあります。",kana:"れいぞうこにケーキがいれてあります。",zh:"蛋糕放在冰箱裡。",why:"入れる→入れてある，有人放進去的。"}],
 cmp:"💡 自動詞＋ている＝單純的狀態；他動詞＋てある＝有人事先做好的狀態。"},
{no:"43",t:"〜てみる",scene:"s43",
 form:"動詞て形 ＋ みる（試試看…）",
 explain:"「〜てみる」＝<b>試著做做看</b>。想知道結果、體驗一下。<br>〜てみたい＝想試試看、〜てみてください＝請試試看。<br>「みる」要用平假名。",
 ex:[
 {jp:"この服を着てみてもいいですか。",kana:"このふくをきてみてもいいですか。",zh:"可以試穿這件衣服嗎？",why:"着る→着て＋みる；後面再接てもいいですか。"},
 {jp:"日本の料理を食べてみたいです。",kana:"にほんのりょうりをたべてみたいです。",zh:"想試吃日本料理。",why:"食べてみる＋たい。"},
 {jp:"先生に聞いてみます。",kana:"せんせいにきいてみます。",zh:"我問問看老師。",why:"聞く→聞いて＋みる。"},
 {jp:"一度、行ってみてください。",kana:"いちど、いってみてください。",zh:"請去看看。",why:"行く→行って＋みてください。"}],
 cmp:"💡 〜てみる＝試試看；不是『看』的意思，所以用平假名「みる」。"}
]});

{no:"48",t:"〜ても",scene:"s48",

{no:"49",t:"〜た形",scene:"s49",

 {jp:"駅まで歩いて行った。",kana:"えきまであるいていった。",zh:"走路去了車站。",why:"行く是例外：行って→行った。"},

{no:"51",t:"〜たことがある／ない",scene:"s51",

{no:"52",t:"〜たり〜たりする",scene:"s52",
 form:"動詞た形＋り、動詞た形＋り ＋ する",
 explain:"「〜たり〜たりする」＝<b>從很多事情裡挑幾個當例子</b>：「做做這個、做做那個（之類的）」。<br>① 沒有先後順序（和「〜て、〜て」不同）。<br>② 時態、禮貌度都寫在最後的<b>する</b>：〜たりします／〜たりしました。<br>③ 也可以表示<b>反覆交替</b>：降ったりやんだり（下下停停）。",
 ex:[
 {jp:"休みの日は、本を読んだり、映画を見たりします。",kana:"やすみのひは、ほんをよんだり、えいがをみたりします。",zh:"假日會看看書、看看電影。",why:"読んだ＋り、見た＋り，最後加します。"},
 {jp:"昨日は、掃除したり洗濯したりしました。",kana:"きのうは、そうじしたりせんたくしたりしました。",zh:"昨天打掃啦、洗衣服啦。",why:"過去的事：最後的する變成しました。"},
 {jp:"朝から雨が降ったりやんだりしています。",kana:"あさからあめがふったりやんだりしています。",zh:"從早上開始雨就下下停停。",why:"兩個相反的動作交替發生。"}],
 cmp:"💡 〜て〜て＝照順序全部做；〜たり〜たり＝舉幾個例子，不管順序。"},
{no:"53",t:"〜たまま",scene:"s53",
 form:"動詞た形 ＋ まま<br>名詞 ＋ の ＋ まま",
 explain:"「まま」＝<b>保持原樣不動</b>。「Aたまま、B」＝在 A 的狀態<b>沒有改變</b>的情況下，做了 B。<br>通常 A 是『照理說應該要改變』的狀態：電視應該關、鞋子應該脫，但是沒有。<br>所以常帶有『不太好、忘記了』的感覺。",
 ex:[
 {jp:"テレビをつけたまま、寝てしまいました。",kana:"テレビをつけたまま、ねてしまいました。",zh:"電視開著就睡著了。",why:"つける→つけた＋まま；開著的狀態沒變。"},
 {jp:"靴を履いたまま、部屋に入らないでください。",kana:"くつをはいたまま、へやにはいらないでください。",zh:"請不要穿著鞋子進房間。",why:"履く→履いた＋まま。"},
 {jp:"窓を開けたまま、出かけました。",kana:"まどをあけたまま、でかけました。",zh:"窗戶開著就出門了。",why:"開ける→開けた＋まま。"},
 {jp:"この町は、昔のままです。",kana:"このまちは、むかしのままです。",zh:"這個城鎮還是從前的樣子。",why:"名詞＋のまま：和以前一樣沒變。"}],
 cmp:"💡 想像按了「暫停鍵」：前面的狀態就停在那裡。"},
{no:"54",t:"〜たら",scene:"s54",
 form:"動詞た形 ＋ ら（行ったら）<br>い形容詞：〜かったら（安かったら）<br>な形容詞・名詞：〜だったら（暇だったら／雨だったら）<br>否定：〜なかったら",
 explain:"「たら」有兩個意思，都是『A 成立之後，B』：<br>① <b>如果…的話</b>（不確定會不會發生）：雨が降ったら、行きません。<br>② <b>…之後就</b>（確定會發生）：駅に着いたら、電話します。<br>變法很簡單：<b>過去的普通形＋ら</b>。<br>後半句可以放請求、邀請、想做的事，是條件句裡最好用的一個。",
 ex:[
 {jp:"雨が降ったら、行きません。",kana:"あめがふったら、いきません。",zh:"如果下雨就不去。",why:"假設：降る→降った＋ら。"},
 {jp:"駅に着いたら、電話してください。",kana:"えきについたら、でんわしてください。",zh:"到車站之後請打電話給我。",why:"確定會到，表示「之後」。"},
 {jp:"安かったら、買います。",kana:"やすかったら、かいます。",zh:"便宜的話就買。",why:"い形容詞：安い→安かった＋ら。"},
 {jp:"暇だったら、遊びに来てください。",kana:"ひまだったら、あそびにきてください。",zh:"有空的話請來玩。",why:"な形容詞：暇→暇だった＋ら。"}],
 cmp:"💡 後面想接「〜てください」「〜たい」「〜ましょう」時，用たら最安全。"}
]});

{no:"56",t:"〜普通形",scene:"s56",

{no:"57",t:"〜名詞修飾形",scene:"s57",
 form:"動詞・い形容詞：普通形 ＋ 名詞（買った本／高い本）<br>な形容詞：〜な ＋ 名詞（静かな部屋）<br>名詞：〜の ＋ 名詞（日本語の本）",
 explain:"名詞修飾形＝<b>放在名詞前面、用來說明那個名詞的形</b>。<br>中文說「昨天買<b>的</b>書」，日文<b>不用加「的」</b>，直接把普通形貼在名詞前面：昨日買った本。<br>幾乎和普通形一樣，只有兩個地方不同：<br>① な形容詞：だ→<b>な</b>（静かな部屋）<br>② 名詞：だ→<b>の</b>（日本語の本）<br>另外，修飾句裡的主語用<b>が</b>，不用は。",
 ex:[

{no:"58",t:"〜と思う",scene:"s58",
 form:"普通形 ＋ と思う<br>（な形容詞・名詞要有「だ」：便利だと思う／雨だと思う）",
 explain:"「〜と思う」＝<b>我覺得…、我想…</b>。把腦袋裡的想法用「と」框起來，再加思う。<br>① 表示<b>意見或推測</b>。<br>② 「と」前面一定是<b>普通形</b>。<br>③ 否定通常放在前面：来ないと思います（我想他不會來）。<br>④ 「〜と思います」的主語是<b>我</b>；講別人的想法用「〜と思っています」。",
 ex:[
 {jp:"明日は雨が降ると思います。",kana:"あしたはあめがふるとおもいます。",zh:"我想明天會下雨。",why:"動詞普通形＋と思います。"},
 {jp:"この映画は面白いと思います。",kana:"このえいがはおもしろいとおもいます。",zh:"我覺得這部電影很有趣。",why:"い形容詞普通形＋と思います。"},
 {jp:"田中さんは来ないと思います。",kana:"たなかさんはこないとおもいます。",zh:"我想田中先生不會來。",why:"否定放在前面：来ない＋と思います。"},
 {jp:"この町は静かだと思います。",kana:"このまちはしずかだとおもいます。",zh:"我覺得這個城鎮很安靜。",why:"な形容詞要加だ：静かだ＋と思います。"}],
 cmp:"💡 ×面白いですと思います → ○面白いと思います（前面不能用です・ます）。"},
{no:"59",t:"〜と言った",scene:"s59",

{no:"60",t:"〜と",scene:"s60",
 form:"動詞辞書形／ない形 ＋ と、〜<br>（一…就…；一定會發生的結果）",
 explain:"「Aと、B」＝<b>只要 A，就一定 B</b>。像按開關一樣，結果每次都相同。<br>常用在：<br>① 自然現象：春になると、桜が咲く。<br>② 機器操作：ボタンを押すと、お釣りが出る。<br>③ 指路：右に曲がると、銀行がある。<br>因為 B 是『自動發生』的事，所以 B <b>不能放</b>請求、邀請、想做的事（〜てください、〜ましょう、〜たい）。",
 ex:[
 {jp:"春になると、桜が咲きます。",kana:"はるになると、さくらがさきます。",zh:"一到春天，櫻花就開。",why:"自然的規律，每年都一樣。"},
 {jp:"このボタンを押すと、お釣りが出ます。",kana:"このボタンをおすと、おつりがでます。",zh:"按這個按鈕，零錢就會出來。",why:"機器的操作結果。"},
 {jp:"右に曲がると、銀行があります。",kana:"みぎにまがると、ぎんこうがあります。",zh:"往右轉就有銀行。",why:"指路時常用。"},
 {jp:"お金がないと、困ります。",kana:"おかねがないと、こまります。",zh:"沒有錢就傷腦筋了。",why:"ない形＋と。"}],
 cmp:"💡 ×安いと、買ってください → ○安かったら、買ってください。"}
]});

{no:"62",t:"〜だろう",scene:"s62",

 explain:"「〜だろう」＝<b>應該…吧</b>。說話的人有相當的把握在推測。<br>① 禮貌說法是<b>でしょう</b>（天氣預報最常聽到：明日は雨でしょう）。<br>② 常和「たぶん（大概）」「きっと（一定）」一起用。<br>③ 直接說「だろう」語氣比較硬，多半是男性或寫文章時用。",

{no:"63",t:"〜だろうと思う",scene:"s63",

{no:"64",t:"〜んです",scene:"s64",

{no:"65",t:"〜ので",scene:"s65",
 form:"普通形 ＋ ので<br>（な形容詞・名詞：〜なので　静かなので／休みなので）",
 explain:"「Aので、B」＝<b>因為 A，所以 B</b>。<br>和「から」意思一樣，但是語氣<b>比較客觀、柔和</b>，像在陳述『事情自然就變成這樣』，所以很適合用來<b>道歉、請假、拒絕</b>。<br>注意：な形容詞和名詞要用<b>な</b>ので。",
 ex:[
 {jp:"雨が降っているので、傘を持っていきます。",kana:"あめがふっているので、かさをもっていきます。",zh:"因為在下雨，所以帶傘去。",why:"降っている＋ので。"},
 {jp:"頭が痛いので、早く帰ります。",kana:"あたまがいたいので、はやくかえります。",zh:"因為頭痛，所以要早點回去。",why:"い形容詞＋ので。"},
 {jp:"今日は休みなので、家にいます。",kana:"きょうはやすみなので、いえにいます。",zh:"因為今天放假，所以在家。",why:"名詞＋なので。"},
 {jp:"用事があるので、お先に失礼します。",kana:"ようじがあるので、おさきにしつれいします。",zh:"因為有事，我先告辭了。",why:"客氣地說明理由。"}],
 cmp:"💡 から＝強調『我的理由』；ので＝客觀、有禮貌。"},
{no:"66",t:"〜のに",scene:"s66",
 form:"普通形 ＋ のに<br>（な形容詞・名詞：〜なのに　暇なのに／日曜日なのに）",
 explain:"「Aのに、B」＝<b>明明 A，卻 B</b>。照理說 A 之後應該會有某個結果，可是實際上完全相反。<br>重點是<b>情緒</b>：帶有<b>驚訝、不滿、可惜</b>的感覺。<br>因為 B 是已經發生的事實，所以 B 不放請求或意志（×〜のに、〜てください）。",
 ex:[
 {jp:"薬を飲んだのに、治りません。",kana:"くすりをのんだのに、なおりません。",zh:"明明吃了藥，卻沒有好。",why:"吃藥應該會好，結果相反。"},
 {jp:"たくさん勉強したのに、テストの点が悪かったです。",kana:"たくさんべんきょうしたのに、テストのてんがわるかったです。",zh:"明明念了很多書，考試分數卻很差。",why:"帶有可惜、不甘心的感覺。"},
 {jp:"日曜日なのに、会社へ行かなければなりません。",kana:"にちようびなのに、かいしゃへいかなければなりません。",zh:"明明是星期天，卻必須去公司。",why:"名詞＋なのに。"},
 {jp:"約束したのに、彼は来ませんでした。",kana:"やくそくしたのに、かれはきませんでした。",zh:"明明約好了，他卻沒有來。",why:"帶有不滿的感覺。"}],
 cmp:"💡 のに＝帶情緒的『卻』；ても＝單純的『即使…也』。"}
]});

UNITS.push({name:"第14單元　動詞可能／命令／禁止形",cards:[
{no:"67",t:"動詞可能形（ｅ）る",scene:"s67",
 form:"Ⅰ組：う段 → え段 ＋ る　書く→書ける／飲む→飲める／買う→買える<br>Ⅱ組：る → られる　食べる→食べられる／見る→見られる<br>Ⅲ組：する→できる／来る→来られる（こられる）",
 explain:"可能形＝<b>能…、會…</b>的形。<br>① Ⅰ組：最後一個音換成<b>え段</b>再加る（く→け＋る）<br>② Ⅱ組：去掉る，加<b>られる</b><br>③ Ⅲ組：する→<b>できる</b>、来る→来られる<br>變完之後，全部都當成<b>Ⅱ組動詞</b>來活用：書ける→書けます→書けない→書けた。<br>原本的「を」通常換成<b>が</b>：漢字<b>を</b>書く → 漢字<b>が</b>書ける。",
 ex:[
 {jp:"私は漢字が書けます。",kana:"わたしはかんじがかけます。",zh:"我會寫漢字。",why:"書く→書ける；を換成が。"},
 {jp:"刺身が食べられますか。",kana:"さしみがたべられますか。",zh:"你敢吃（能吃）生魚片嗎？",why:"食べる（Ⅱ組）→食べられる。"},
 {jp:"明日は来られません。",kana:"あしたはこられません。",zh:"明天不能來。",why:"来る→来られる，讀作「こられる」。"},
 {jp:"日本語が少し話せます。",kana:"にほんごがすこしはなせます。",zh:"我會說一點日文。",why:"話す→話せる（す→せ＋る）。"}],
 cmp:"💡 分かる、できる 本身就有『能』的意思，沒有可能形。"},
{no:"68",t:"可能形的用法",scene:"s68",
 form:"人 は 對象 が ＋ 可能形（能力）<br>場所 で（は）對象 が ＋ 可能形（狀況允許）",
 explain:"可能形表示兩種『能』：<br>① <b>能力</b>：自己有沒有這個本事。私は泳げません。<br>② <b>狀況</b>：環境、規定允不允許。この図書館で勉強できます。<br>容易搞混的一組：<br>・<b>見える／聞こえる</b>＝自然而然進到眼睛、耳朵（不用努力）<br>・<b>見られる／聞ける</b>＝有條件才『能看、能聽』（有票、有時間、去到那裡）",
 ex:[
 {jp:"私は泳げません。",kana:"わたしはおよげません。",zh:"我不會游泳。",why:"能力：泳ぐ→泳げる。"},
 {jp:"この図書館では、夜九時まで勉強できます。",kana:"このとしょかんでは、よるくじまでべんきょうできます。",zh:"這間圖書館可以念書到晚上九點。",why:"狀況：規定允許。"},
 {jp:"ここから富士山が見えます。",kana:"ここからふじさんがみえます。",zh:"從這裡看得到富士山。",why:"自然映入眼簾，用見える。"},
 {jp:"動物園でパンダが見られます。",kana:"どうぶつえんでパンダがみられます。",zh:"在動物園可以看到貓熊。",why:"要去動物園才看得到，用見られる。"}],
 cmp:"💡 聽得到聲音＝聞こえる；可以聽（音樂、廣播）＝聞ける。"},
{no:"69",t:"〜（こと）ができる",scene:"s69",
 form:"動詞辞書形 ＋ ことができる<br>名詞 ＋ ができる",
 explain:"「〜ことができる」＝<b>能…、會…</b>，意思和可能形一樣，只是比較<b>正式</b>，常出現在說明、規定、文章裡。<br>① 動詞用<b>辞書形</b>＋ことができる（助詞「を」保留不變）。<br>② 『動作性名詞』可以直接接：運転ができる、料理ができる。<br>否定：〜ことができません／〜ことはできません。",
 ex:[
 {jp:"私はピアノを弾くことができます。",kana:"わたしはピアノをひくことができます。",zh:"我會彈鋼琴。",why:"弾く（辞書形）＋ことができます；を不變。"},
 {jp:"ここでたばこを吸うことはできません。",kana:"ここでたばこをすうことはできません。",zh:"這裡不能抽菸。",why:"規定：不允許。"},
 {jp:"この図書館では、本を二週間借りることができます。",kana:"このとしょかんでは、ほんをにしゅうかんかりることができます。",zh:"這間圖書館的書可以借兩個星期。",why:"說明規定時常用。"},
 {jp:"私は車の運転ができます。",kana:"わたしはくるまのうんてんができます。",zh:"我會開車。",why:"名詞（運転）＋ができます。"}],
 cmp:"💡 ピアノが弾けます ＝ ピアノを弾くことができます（後者比較正式）。"},
{no:"70",t:"動詞命令形",scene:"s70",
 form:"Ⅰ組：う段 → え段　書く→書け／止まる→止まれ／頑張る→頑張れ<br>Ⅱ組：る → ろ　食べる→食べろ／起きる→起きろ<br>Ⅲ組：する→しろ／来る→来い（こい）",
 explain:"命令形＝<b>很強的命令</b>：「給我…！」<br>① Ⅰ組：最後一個音換成<b>え段</b>（く→け、る→れ）<br>② Ⅱ組：る換成<b>ろ</b><br>③ Ⅲ組：しろ、来い（こい）<br>語氣非常強，一般對話很少直接用。什麼時候會用，看第 72 張。",
 ex:[
 {jp:"早く起きろ。",kana:"はやくおきろ。",zh:"快點起來！",why:"起きる（Ⅱ組）→起きろ。"},
 {jp:"もっと頑張れ。",kana:"もっとがんばれ。",zh:"再加油一點！",why:"頑張る（Ⅰ組）→頑張れ。"},
 {jp:"こっちへ来い。",kana:"こっちへこい。",zh:"過來這邊！",why:"来る→来い，讀作「こい」。"},
 {jp:"静かにしろ。",kana:"しずかにしろ。",zh:"安靜！",why:"する→しろ。"}],
 cmp:"💡 Ⅰ組命令形（書け）和可能形（書ける）只差一個「る」，別看錯。"},
{no:"71",t:"動詞禁止形",scene:"s71",
 form:"動詞辞書形 ＋ な<br>行く→行くな／食べる→食べるな／する→するな／来る→来るな（くるな）",
 explain:"禁止形＝<b>很強的禁止</b>：「不准…！」<br>變法超簡單：<b>辞書形直接加な</b>，三組動詞都一樣。<br>和命令形一樣語氣很強，日常對話不太直接對人說。",
 ex:[
 {jp:"ここに入るな。",kana:"ここにはいるな。",zh:"不准進來這裡！",why:"入る＋な。"},
 {jp:"そんなことを言うな。",kana:"そんなことをいうな。",zh:"不要說那種話！",why:"言う＋な。"},
 {jp:"触るな。",kana:"さわるな。",zh:"不准碰！",why:"触る＋な。"},
 {jp:"心配するな。",kana:"しんぱいするな。",zh:"別擔心！",why:"する＋な；這句是鼓勵對方。"}],
 cmp:"💡 客氣的說法是「〜ないでください」（第 34 張）。"},
{no:"72",t:"〜ろ／〜な（命令・禁止的用法）",scene:"s72",
 form:"命令形／禁止形（單獨使用）<br>「命令形／禁止形」＋ と言う<br>「命令形／禁止形」＋ という意味だ",
 explain:"命令形、禁止形語氣很強，實際上用在這些場合：<br>① <b>上對下</b>：父親對孩子、男性朋友之間。<br>② <b>緊急的時候</b>：逃げろ！（快逃！）<br>③ <b>加油</b>：頑張れ！<br>④ <b>標語、交通號誌</b>：止まれ、入るな。<br>⑤ <b>轉述別人的命令</b>或<b>解釋意思</b>：〜と言いました／〜という意味です。這時候不會失禮，女性也會用。",
 ex:[
 {jp:"火事だ。逃げろ！",kana:"かじだ。にげろ！",zh:"失火了，快逃！",why:"緊急時刻，簡短有力。"},
 {jp:"頑張れ！",kana:"がんばれ！",zh:"加油！",why:"加油打氣。"},
 {jp:"父は私に「早く寝ろ」と言いました。",kana:"ちちはわたしに「はやくねろ」といいました。",zh:"爸爸對我說「快去睡」。",why:"轉述別人的命令。"},
 {jp:"これは「入るな」という意味です。",kana:"これは「はいるな」といういみです。",zh:"這是「不准進入」的意思。",why:"解釋標誌的意思。"}],
 cmp:"💡 自己對別人說要小心；轉述、解釋時可以放心用。"},
{no:"73",t:"〜なさい",scene:"s73",
 form:"動詞ます形（去ます）＋ なさい",
 explain:"「〜なさい」＝<b>溫和一點的命令</b>：「去…」「要…」。<br>常見的是<b>父母對小孩、老師對學生</b>。比命令形（食べろ）溫柔，但還是命令，<b>不能對長輩、上司用</b>。<br>考卷上的指示也常用：次の問題に答えなさい。",
 ex:[
 {jp:"早く寝なさい。",kana:"はやくねなさい。",zh:"快去睡。",why:"寝ます→寝＋なさい。"},
 {jp:"野菜も食べなさい。",kana:"やさいもたべなさい。",zh:"蔬菜也要吃。",why:"食べます→食べ＋なさい。"},
 {jp:"もっと大きい声で話しなさい。",kana:"もっとおおきいこえではなしなさい。",zh:"說話再大聲一點。",why:"話します→話し＋なさい。"},
 {jp:"次の問題に答えなさい。",kana:"つぎのもんだいにこたえなさい。",zh:"請回答下一題。",why:"考卷上的指示。"}],
 cmp:"💡 強度：食べろ（命令形）＞ 食べなさい ＞ 食べてください。"}
]});
UNITS.push({name:"第15單元　動詞意向形",cards:[
{no:"74",t:"動詞意向形（よ）う",scene:"s74",

 explain:"意向形＝<b>「…吧！」「來…吧」</b>的形，是「〜ましょう」的普通形。<br>① Ⅰ組：最後一個音換成<b>お段</b>再加う（く→こ＋う）。讀的時候拉長：いこー。<br>② Ⅱ組：る換成<b>よう</b><br>③ Ⅲ組：しよう、来よう（こよう）",
 ex:[
 {jp:"もう遅いから、帰ろう。",kana:"もうおそいから、かえろう。",zh:"已經很晚了，回家吧。",why:"帰る（Ⅰ組）→帰ろう。"},
 {jp:"一緒に昼ご飯を食べよう。",kana:"いっしょにひるごはんをたべよう。",zh:"一起吃午飯吧。",why:"食べる（Ⅱ組）→食べよう。"},
 {jp:"明日、映画を見に行こう。",kana:"あした、えいがをみにいこう。",zh:"明天去看電影吧。",why:"行く→行こう。"},
 {jp:"少し休もう。",kana:"すこしやすもう。",zh:"休息一下吧。",why:"休む→休もう（む→も＋う）。"}],
 cmp:"💡 行きましょう（禮貌）＝ 行こう（普通形）。"},
{no:"75",t:"意向形的用法",scene:"s75",
 form:"意向形（邀約、自言自語）<br>意向形 ＋ か（提議、主動幫忙）",
 explain:"意向形單獨使用時有三種情況：<br>① <b>邀約朋友</b>一起做：一緒に帰ろう。<br>② <b>自言自語</b>，在心裡下決定：今日は早く寝よう。<br>③ 加「か」＝<b>提議</b>或<b>主動幫忙</b>：荷物を持とうか（我幫你拿吧？）<br>因為是普通形，只對朋友、家人用；對長輩用「〜ましょう／〜ましょうか」。",
 ex:[
 {jp:"一緒に帰ろう。",kana:"いっしょにかえろう。",zh:"一起回家吧。",why:"邀約朋友。"},
 {jp:"疲れたから、今日は早く寝よう。",kana:"つかれたから、きょうははやくねよう。",zh:"好累，今天早點睡吧。",why:"自言自語、下決定。"},
 {jp:"荷物を持とうか。",kana:"にもつをもとうか。",zh:"我幫你拿行李吧？",why:"意向形＋か：主動提議幫忙。"},
 {jp:"何を食べようか。",kana:"なにをたべようか。",zh:"要吃什麼呢？",why:"和對方商量。"}],
 cmp:"💡 持とうか＝持ちましょうか（我來拿吧？）的普通形。"},
{no:"76",t:"〜（よ）うと思う",scene:"s76",
 form:"意向形 ＋ と思う／と思っている",
 explain:"「〜（よ）うと思う」＝<b>我打算…、我想要…</b>。把心裡的決定（意向形）用「と思う」告訴別人。<br>・<b>と思います</b>：現在剛想到、剛決定。<br>・<b>と思っています</b>：這個想法已經<b>持續一段時間</b>了。<br>否定：「〜（よ）うとは思いません」＝完全沒有這個打算。",
 ex:[
 {jp:"来年、日本へ行こうと思っています。",kana:"らいねん、にほんへいこうとおもっています。",zh:"我打算明年去日本。",why:"想了一段時間，用と思っています。"},
 {jp:"今日は早く寝ようと思います。",kana:"きょうははやくねようとおもいます。",zh:"我今天想早點睡。",why:"現在的決定，用と思います。"},
 {jp:"夏休みに、国へ帰ろうと思っています。",kana:"なつやすみに、くにへかえろうとおもっています。",zh:"我打算暑假回國。",why:"帰る→帰ろう＋と思っています。"},
 {jp:"新しいパソコンを買おうと思っています。",kana:"あたらしいパソコンをかおうとおもっています。",zh:"我打算買新電腦。",why:"買う→買おう＋と思っています。"}],
 cmp:"💡 行くと思う＝我猜（某人）會去；行こうと思う＝我自己打算去。"},
{no:"77",t:"〜（よ）うとする",scene:"s77",
 form:"意向形 ＋ とする<br>意向形 ＋ としたとき、〜",
 explain:"「〜（よ）うとする」有兩個意思：<br>① <b>正要…的那一刻</b>：動作還沒開始，就在前一秒。常用「〜（よ）うとしたとき、…」，後面接突然發生的事。<br>② <b>努力想要…</b>：試著去做（但不一定成功）。<br>和「〜（よ）うと思う」不同：と思う只是『想』，とする已經<b>要動手了</b>。",
 ex:[

 {jp:"電車に乗ろうとしたとき、ドアが閉まりました。",kana:"でんしゃにのろうとしたとき、ドアがしまりました。",zh:"正要上電車的時候，門關了。",why:"乗る→乗ろう＋としたとき。"},
 {jp:"子どもは、自分で靴を履こうとしています。",kana:"こどもは、じぶんでくつをはこうとしています。",zh:"小孩正努力想自己穿鞋。",why:"努力嘗試：履く→履こう＋としています。"},
 {jp:"寝ようとしても、眠れません。",kana:"ねようとしても、ねむれません。",zh:"就算想睡也睡不著。",why:"努力想睡，但做不到。"}],
 cmp:"💡 〜てみる＝實際做做看；〜（よ）うとする＝想做、正要做（還沒做成）。"}
]});
UNITS.push({name:"第16單元　自他動詞",cards:[
{no:"78",t:"自他動詞的意思",scene:"s78",
 form:"自動詞：物 が ＋ 自動詞（ドアが開く）<br>他動詞：人 が 物 を ＋ 他動詞（私がドアを開ける）",
 explain:"日文很多動詞是<b>兩個一對</b>的：<br>① <b>自動詞</b>：東西<b>自己</b>變成那樣（或不說是誰做的），只看<b>結果</b>。用<b>が</b>。<br>　ドア<b>が</b>開く（門開了）<br>② <b>他動詞</b>：有人<b>動手去做</b>，看的是<b>人的動作</b>。用<b>を</b>。<br>　ドア<b>を</b>開ける（把門打開）<br>判斷方法：句子裡有沒有『被動到的東西＋を』。",
 ex:[
 {jp:"ドアが開きました。",kana:"ドアがあきました。",zh:"門開了。",why:"自動詞：開く。只說門的變化。"},
 {jp:"私はドアを開けました。",kana:"わたしはドアをあけました。",zh:"我把門打開了。",why:"他動詞：開ける。有人動手，用を。"},
 {jp:"電気が消えました。",kana:"でんきがきえました。",zh:"燈熄了。",why:"自動詞：消える。"},

 explain:"間接被動又叫<b>『受害的被動』</b>：別人做了某件事（不是直接對我做），結果<b>我覺得很困擾</b>。<br>特別的地方：連<b>自動詞</b>也可以變被動！<br>・雨が降った（下雨了）→ 私は雨<b>に</b>降<b>られた</b>（我被雨淋了，真倒楣）<br>・子どもが泣いた → 子ども<b>に</b>泣<b>かれた</b>（小孩一直哭，害我很困擾）<br>中文沒有這種說法，要多看例句習慣。",
 ex:[
 {jp:"私は雨に降られました。",kana:"わたしはあめにふられました。",zh:"我被雨淋了。",why:"自動詞：降る→降られる。"},
 {jp:"夜中に子どもに泣かれて、眠れませんでした。",kana:"よなかにこどもになかれて、ねむれませんでした。",zh:"半夜小孩一直哭，害我睡不著。",why:"自動詞：泣く→泣かれる。"},
 {jp:"隣の人にたばこを吸われて、困りました。",kana:"となりのひとにたばこをすわれて、こまりました。",zh:"旁邊的人抽菸，讓我很困擾。",why:"吸う→吸われる（う→わ＋れる）。"},
 {jp:"友達に急に来られて、困りました。",kana:"ともだちにきゅうにこられて、こまりました。",zh:"朋友突然跑來，讓我很傷腦筋。",why:"来る→来られる。"}],
 cmp:"💡 這種被動通常是『困擾』，好事不適用（好事用〜てくれる／〜てもらう）。"},
{no:"92",t:"無情物被動",scene:"s92",
 form:"物・事 が（は）〜（ら）れる<br>物・事 は 人 によって 〜（ら）れる",
 explain:"主語是<b>東西或事情</b>的被動句。用在<b>不知道、或不需要說是誰做的</b>時候，重點放在『那個東西怎麼了』。<br>常用來講：<b>建築、發明、舉辦活動、社會上的事實</b>。<br>沒有受害的感覺，只是客觀敘述。<br>如果要說出作者、發明者，用「<b>によって</b>」。",
 ex:[
 {jp:"この寺は、五百年前に建てられました。",kana:"このてらは、ごひゃくねんまえにたてられました。",zh:"這座寺廟是五百年前建的。",why:"建てる→建てられる；不提是誰蓋的。"},
 {jp:"会議は三時から開かれます。",kana:"かいぎはさんじからひらかれます。",zh:"會議三點開始舉行。",why:"開く（ひらく）→開かれる。"},
 {jp:"この本は、多くの人に読まれています。",kana:"このほんは、おおくのひとによまれています。",zh:"這本書被很多人閱讀。",why:"読む→読まれる。"},
 {jp:"電話は、ベルによって発明されました。",kana:"でんわは、ベルによってはつめいされました。",zh:"電話是貝爾發明的。",why:"發明者用によって。"}],
 cmp:"💡 創作、發明、建造的人，用「によって」比「に」自然。"}
]});
UNITS.push({name:"第19單元　使役",cards:[
{no:"93",t:"動詞使役形（さ）せる",scene:"s93",

 explain:"使役形＝<b>「叫（讓）別人做…」</b>的形。<br>① Ⅰ組：最後一個音換成<b>あ段</b>＋せる<br>② Ⅱ組：去掉る＋<b>させる</b><br>③ Ⅲ組：させる、来させる<br>變完之後當<b>Ⅱ組動詞</b>活用：書かせる→書かせます→書かせた。<br>有兩種意思：<br>・<b>強制</b>：上對下命令去做（叫他做）<br>・<b>允許</b>：同意對方想做的事（讓他做）",
 ex:[

 {jp:"母は子どもに野菜を食べさせました。",kana:"はははこどもにやさいをたべさせました。",zh:"媽媽叫小孩吃蔬菜。",why:"食べる→食べさせる。"},
 {jp:"父は私を買い物に行かせました。",kana:"ちちはわたしをかいものにいかせました。",zh:"爸爸叫我去買東西。",why:"行く→行かせる。"},
 {jp:"母は子どもに好きなお菓子を買わせました。",kana:"はははこどもにすきなおかしをかわせました。",zh:"媽媽讓小孩買他喜歡的零食。",why:"買う→買わせる（允許）。"}],
 cmp:"💡 被動＝あ段＋れる；使役＝あ段＋せる。換法一樣，只差一個字。"},
{no:"94",t:"動作者「に」使役",scene:"s94",

 {jp:"先生は学生に漢字を書かせます。",kana:"せんせいはがくせいにかんじをかかせます。",zh:"老師叫學生寫漢字。",why:"「漢字を」已經用了を，所以學生用に。"},
 {jp:"母は私に部屋を掃除させました。",kana:"はははわたしにへやをそうじさせました。",zh:"媽媽叫我打掃房間。",why:"掃除する→掃除させる。"},
 {jp:"私は子どもに牛乳を飲ませました。",kana:"わたしはこどもにぎゅうにゅうをのませました。",zh:"我讓小孩喝牛奶。",why:"飲む→飲ませる。"},
 {jp:"先生は学生に意見を言わせました。",kana:"せんせいはがくせいにいけんをいわせました。",zh:"老師讓學生發表意見。",why:"言う→言わせる（う→わ＋せる）。"}],
 cmp:"💡 有「東西を」→ 人用「に」。"},
{no:"95",t:"動作者「を」使役",scene:"s95",

 ex:[

 {jp:"父は弟を買い物に行かせました。",kana:"ちちはおとうとをかいものにいかせました。",zh:"爸爸叫弟弟去買東西。",why:"行く（自動詞）→行かせる。"},
 {jp:"兄は妹を泣かせました。",kana:"あにはいもうとをなかせました。",zh:"哥哥把妹妹弄哭了。",why:"感情動詞：泣く→泣かせる。"},

{no:"96",t:"〜（さ）せてください",scene:"s96",
 form:"使役形的て形 ＋ ください<br>更客氣：〜（さ）せていただけませんか",
 explain:"「〜（さ）せてください」＝<b>請讓我…</b>。<br>拆開來看：（さ）せる（讓我做）＋てください（請）。<br><b>做動作的人是『我』</b>，是在請對方<b>允許</b>。<br>比較：<br>・帰ってください＝請<b>你</b>回去<br>・帰<b>らせて</b>ください＝請讓<b>我</b>回去<br>對上司、老師可以用更客氣的「〜（さ）せていただけませんか」。",
 ex:[
 {jp:"すみませんが、今日は早く帰らせてください。",kana:"すみませんが、きょうははやくかえらせてください。",zh:"不好意思，今天請讓我早點回去。",why:"帰る→帰らせる→帰らせて＋ください。"},
 {jp:"その仕事は、私にやらせてください。",kana:"そのしごとは、わたしにやらせてください。",zh:"那份工作請讓我來做。",why:"やる→やらせる→やらせて＋ください。"},
 {jp:"少し考えさせてください。",kana:"すこしかんがえさせてください。",zh:"請讓我考慮一下。",why:"考える→考えさせる。"},
 {jp:"明日、休ませていただけませんか。",kana:"あした、やすませていただけませんか。",zh:"明天可以讓我請假嗎？",why:"更客氣的說法。"}],

{no:"97",t:"使役被動（さ）せられる",scene:"s97",
 form:"Ⅰ組：あ段 ＋ せられる → 常縮短成 あ段 ＋ される　書く→書かされる／待つ→待たされる<br>　（「す」結尾不縮短：話す→話させられる）<br>Ⅱ組：る → させられる　食べる→食べさせられる<br>Ⅲ組：する→させられる／来る→来させられる（こさせられる）",
 explain:"使役（叫我做）＋被動（被）＝<b>被叫去做…、被迫…</b>。<br>說的是：<b>我不想做，但是被別人逼著做了</b>。主語是『倒楣的我』。<br>句型：私は　人に　〜（さ）せられる。<br>Ⅰ組動詞的「〜せられる」念起來很長，通常縮短成「<b>〜される</b>」：<br>書かせられる → 書か<b>される</b>。",
 ex:[
 {jp:"私は母に野菜を食べさせられました。",kana:"わたしはははにやさいをたべさせられました。",zh:"我被媽媽逼著吃蔬菜。",why:"食べる（Ⅱ組）→食べさせられる。"},
 {jp:"子どものとき、父に毎日勉強させられました。",kana:"こどものとき、ちちにまいにちべんきょうさせられました。",zh:"小時候每天被爸爸逼著念書。",why:"勉強する→勉強させられる。"},
 {jp:"私は先生に一時間立たされました。",kana:"わたしはせんせいにいちじかんたたされました。",zh:"我被老師罰站一個小時。",why:"立つ→立たせられる→立たされる（縮短）。"},
 {jp:"駅で友達に一時間待たされました。",kana:"えきでともだちにいちじかんまたされました。",zh:"我在車站被朋友害得等了一個小時。",why:"待つ→待たされる（縮短）。"}],
 cmp:"💡 使役＝我叫別人做；使役被動＝我被別人叫去做（心裡不願意）。"}
]});
UNITS.push({name:"第20單元　敬語",cards:[
{no:"98",t:"〜（ら）れる（尊敬）",scene:"s98",
 form:"和被動形同形：<br>Ⅰ組：帰る→帰られる／読む→読まれる<br>Ⅱ組：出かける→出かけられる<br>Ⅲ組：する→される／来る→来られる（こられる）",
 explain:"敬語的第一種：直接用<b>和被動形一樣的形</b>來表示<b>尊敬</b>。<br>用在<b>老師、上司、客人</b>的動作上，把對方抬高。<br>優點是變化簡單；尊敬的程度比下一張的「お〜になる」<b>輕一點</b>。<br>怎麼分辨是被動還是尊敬？看主語：主語是值得尊敬的人、而且沒有『被誰』，就是尊敬。",
 ex:[
 {jp:"先生は、もう帰られました。",kana:"せんせいは、もうかえられました。",zh:"老師已經回去了。",why:"帰る→帰られる（尊敬）。"},
 {jp:"社長は、明日東京へ行かれます。",kana:"しゃちょうは、あしたとうきょうへいかれます。",zh:"社長明天要去東京。",why:"行く→行かれる。"},
 {jp:"部長は、この本を読まれましたか。",kana:"ぶちょうは、このほんをよまれましたか。",zh:"部長您看過這本書了嗎？",why:"読む→読まれる。"},
 {jp:"先生は、何時に来られますか。",kana:"せんせいは、なんじにこられますか。",zh:"老師幾點會來呢？",why:"来る→来られる。"}],
 cmp:"💡 自己的動作絕對不能用尊敬語：×私は帰られます。"},
{no:"99",t:"〜お〜になる",scene:"s99",
 form:"お ＋ 動詞ます形（去ます）＋ になる<br>特殊尊敬語：行く・来る・いる→いらっしゃる／食べる・飲む→召し上がる／言う→おっしゃる／見る→ご覧になる／する→なさる",
 explain:"敬語的第二種，比「〜（ら）れる」<b>更尊敬</b>：用「お」和「になる」把動詞<b>夾起來</b>。<br>帰る → <b>お</b>帰り<b>になる</b><br>注意兩件事：<br>① ます形只有一個音的動詞（見る、いる、寝る、着る、来る、する）<b>不能這樣變</b>。<br>② 有些常用動詞有<b>專用的尊敬語</b>，要另外背（いらっしゃる、召し上がる、おっしゃる…）。",
 ex:[
 {jp:"先生は、もうお帰りになりました。",kana:"せんせいは、もうおかえりになりました。",zh:"老師已經回去了。",why:"帰る→お帰りになる。"},
 {jp:"社長は、新聞をお読みになっています。",kana:"しゃちょうは、しんぶんをおよみになっています。",zh:"社長正在看報紙。",why:"読む→お読みになる。"},
 {jp:"部長は、何時にお戻りになりますか。",kana:"ぶちょうは、なんじにおもどりになりますか。",zh:"部長幾點會回來呢？",why:"戻る→お戻りになる。"},
 {jp:"先生は、研究室にいらっしゃいます。",kana:"せんせいは、けんきゅうしつにいらっしゃいます。",zh:"老師在研究室。",why:"いる的特殊尊敬語：いらっしゃる。"}],
 cmp:"💡 尊敬度：帰られる ＜ お帰りになる。"},
{no:"100",t:"〜お〜ください",scene:"s100",
 form:"お ＋ 動詞ます形（去ます）＋ ください<br>ご ＋ 漢語名詞 ＋ ください（ご利用ください／ご注意ください）",
 explain:"「〜てください」的<b>尊敬版</b>：很有禮貌地<b>請對方做某件事</b>。<br>待つ → <b>お</b>待ち<b>ください</b>（請稍候）<br>在<b>車站、商店、公司</b>的廣播和告示上非常常見。<br>「する動詞」用「ご＋漢語＋ください」。",
 ex:[
 {jp:"どうぞ、お入りください。",kana:"どうぞ、おはいりください。",zh:"請進。",why:"入る→お入りください。"},
 {jp:"こちらに、お名前をお書きください。",kana:"こちらに、おなまえをおかきください。",zh:"請在這裡寫上您的大名。",why:"書く→お書きください。"},
 {jp:"少々お待ちください。",kana:"しょうしょうおまちください。",zh:"請稍候。",why:"待つ→お待ちください。"},
 {jp:"どうぞ、ご利用ください。",kana:"どうぞ、ごりようください。",zh:"請多加利用。",why:"利用する→ご利用ください。"}],
 cmp:"💡 待ってください ＜ お待ちください（更有禮貌）。"},
{no:"101",t:"〜お〜する（いたす）",scene:"s101",
 form:"お ＋ 動詞ます形（去ます）＋ する／いたす<br>ご ＋ 漢語名詞 ＋ する／いたす（ご案内します／ご連絡いたします）",
 explain:"這張是<b>謙讓語</b>：講<b>自己的動作</b>時，把自己<b>壓低</b>，間接抬高對方。<br>持つ → <b>お</b>持ち<b>します</b>（我來幫您拿）<br>重點：這個動作必須是<b>『為了對方』或『和對方有關』</b>的動作。和對方無關的事（我回家、我起床）不能用。<br>「いたす」比「する」更謙虛。",
 ex:[
 {jp:"お荷物を、お持ちします。",kana:"おにもつを、おもちします。",zh:"我來幫您拿行李。",why:"持つ→お持ちします。"},
 {jp:"駅まで、お送りします。",kana:"えきまで、おおくりします。",zh:"我送您到車站。",why:"送る→お送りします。"},
 {jp:"明日、ご連絡いたします。",kana:"あした、ごれんらくいたします。",zh:"明天再跟您聯絡。",why:"連絡する→ご連絡いたします。"},
 {jp:"私が、ご案内します。",kana:"わたしが、ごあんないします。",zh:"由我來為您帶路。",why:"案内する→ご案内します。"}],
 cmp:"💡 お〜になる＝對方的動作（尊敬）；お〜する＝我的動作（謙讓）。主語相反！"},
{no:"102",t:"〜でございます",scene:"s102",
 form:"名詞 ＋ でございます（＝です）<br>〜が／に ＋ ございます（＝あります）",
 explain:"這是<b>丁重語</b>：不是抬高誰或壓低誰，而是把<b>整句話</b>說得非常客氣、鄭重。<br>・です → <b>でございます</b><br>・あります → <b>ございます</b><br>常聽到的場合：<b>百貨公司、飯店、電話應對</b>。<br>注意：講<b>對方</b>是誰的時候不用でございます，要用「でいらっしゃいます」。",
 ex:[
 {jp:"こちらは、受付でございます。",kana:"こちらは、うけつけでございます。",zh:"這裡是櫃台。",why:"です→でございます。"},
 {jp:"お手洗いは、二階にございます。",kana:"おてあらいは、にかいにございます。",zh:"洗手間在二樓。",why:"あります→ございます。"},
 {jp:"はい、田中でございます。",kana:"はい、たなかでございます。",zh:"您好，我是田中。",why:"接電話時報上自己的姓名。"},
 {jp:"全部で、千円でございます。",kana:"ぜんぶで、せんえんでございます。",zh:"一共是一千日圓。",why:"店員結帳時的說法。"}],
 cmp:"💡 ありがとうございます、おはようございます 裡的「ございます」就是它。"},
{no:"103",t:"〜お／ご＋名詞",scene:"s103",
 form:"お ＋ 和語（訓讀的詞）：お名前、お仕事、お国、お手紙<br>ご ＋ 漢語（音讀的詞）：ご家族、ご住所、ご両親、ご意見<br>例外（漢語卻用お）：お電話、お時間、お食事、お元気",
 explain:"在名詞（或形容詞）前面加「お／ご」有兩個作用：<br>① <b>尊敬</b>：表示這是<b>對方的</b>東西。お名前＝您的大名。<br>② <b>美化</b>：只是讓話聽起來比較文雅。お茶、お金、お酒。<br>用哪一個？大原則：<br>・<b>お＋和語</b>（日本原有的詞，漢字訓讀）<br>・<b>ご＋漢語</b>（從中文來的詞，漢字音讀）<br>外來語（片假名）通常不加。有少數例外要另外記。",
 ex:[

prevB.onclick=()=>go(-1);nextB.onclick=()=>go(1);
document.addEventListener('keydown',e=>{if(e.target===q)return;if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1)});
let tx=null;document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)>70)go(d<0?1:-1)});
buildNav();build();render();
</script>
</body>
</html>
