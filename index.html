<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>穩紮穩打 N4 文法小卡</title>
<style>
:root{--bg:#fff7fa;--card:#fff;--pink:#ffd6e5;--mint:#d4f3e6;--sky:#d6ebff;--lemon:#fff3c4;--coral:#ff6b4a;--ink:#4a3f47}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}
header{padding:14px 16px 8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:760px;margin:auto}
header h1{font-size:18px;margin:0;flex:1 1 auto}
#q{flex:1 1 160px;padding:9px 14px;border:2px solid var(--pink);border-radius:999px;font-size:15px;outline:none;background:#fff}
#q:focus{border-color:var(--coral)}
#nav{max-width:760px;margin:0 auto;padding:0 16px 8px;display:flex;gap:6px;flex-wrap:wrap}
#nav button{border:0;background:var(--pink);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
#nav button.on{background:var(--coral);color:#fff}
main{max-width:760px;margin:auto;padding:8px 16px 60px}
.unit{font-size:14px;color:#a07c8d;margin:18px 0 8px;font-weight:700}
.card{background:var(--card);border-radius:22px;box-shadow:0 4px 0 var(--pink);margin-bottom:22px;overflow:hidden;border:2px solid var(--pink)}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px 0}
.no{background:var(--lemon);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.title{font-size:26px;font-weight:800;color:var(--coral)}
.scene{position:relative;height:130px;margin:10px 14px;border-radius:16px;background:linear-gradient(var(--sky) 0 72%,var(--mint) 72%);overflow:hidden;cursor:pointer}
.scene .e{position:absolute;font-size:38px;line-height:1}
.scene .g{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:11px;background:#fff9;border-radius:99px;padding:1px 8px}
.pop{position:absolute;background:var(--coral);color:#fff;font-weight:800;border-radius:12px;padding:2px 10px;font-size:20px}
.sec{padding:0 16px 10px}
.lab{display:inline-block;font-size:12px;font-weight:700;background:var(--sky);border-radius:8px;padding:1px 8px;margin-bottom:4px}
.formula{font-size:16px;line-height:1.7;background:var(--lemon);border-radius:12px;padding:6px 12px}
.explain{line-height:1.8;font-size:15px}
.ex{border:2px dashed var(--pink);border-radius:14px;padding:8px 12px;margin:8px 0;cursor:pointer;transition:.15s}
.ex:hover{background:#fff3f8}
.ex .jp{font-size:19px;font-weight:700}
.ex .zh{font-size:14px;margin-top:2px}
.ex .more{display:none;margin-top:6px;font-size:14px;line-height:1.7;background:var(--mint);border-radius:10px;padding:6px 10px}
.ex.open .more{display:block}
.hint{font-size:12px;color:#b08fa0}
.cmp{background:var(--pink);border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.7;margin:0 16px 16px}
.empty{text-align:center;color:#a07c8d;padding:40px}
/* animations */
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
@keyframes wiggle{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}
@keyframes bite{0%,15%{transform:scale(1)}30%{transform:scale(.7)}45%{transform:scale(.7)}60%{transform:scale(.4)}75%,90%{transform:scale(.4);opacity:1}100%{transform:scale(1)}}
@keyframes chew{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
@keyframes walkto{0%{left:6%}70%,100%{left:58%}}
@keyframes land{0%,60%{transform:scale(1)}75%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes drive{0%{left:-20%}100%{left:105%}}
@keyframes bump{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
@keyframes walkr{0%{left:4%}100%{left:60%}}
@keyframes pophop{0%,60%,100%{opacity:0;transform:translateY(6px)}70%,95%{opacity:1;transform:translateY(0)}}
.leg rect{transform-box:fill-box;transform-origin:50% 0}
.kid .l rect{animation:swA .5s ease-in-out infinite}
.kid .r rect{animation:swB .5s ease-in-out infinite}
.kid.still .leg rect{animation:none}
.kid.chew .head{transform-box:fill-box;transform-origin:50% 100%;animation:chew2 .5s ease-in-out infinite}
@keyframes swA{0%,100%{transform:rotate(26deg)}50%{transform:rotate(-26deg)}}
@keyframes swB{0%,100%{transform:rotate(-26deg)}50%{transform:rotate(26deg)}}
@keyframes chew2{0%,100%{transform:rotate(0) translateY(0)}50%{transform:rotate(7deg) translateY(1px)}}
.wig{animation:wig .8s ease-in-out infinite}
@keyframes wig{0%,100%{transform:translateX(0)}50%{transform:translateX(12px)}}
.jump{animation:jump 1s ease-in-out infinite}
@keyframes jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
.apple{transform-box:fill-box;transform-origin:50% 100%;animation:bite2 3s infinite}
@keyframes bite2{0%,10%{transform:scale(1)}30%,40%{transform:scale(.72)}60%,70%{transform:scale(.42)}85%{transform:scale(.42);opacity:1}86%{opacity:0}100%{transform:scale(1);opacity:1}}
.mvni{animation:mvni 3.2s ease-out infinite}
@keyframes mvni{0%{transform:translateX(0)}70%,100%{transform:translateX(190px)}}
.mvhe{animation:mvhe 3.5s linear infinite}
@keyframes mvhe{0%{transform:translateX(0)}100%{transform:translateX(130px)}}
.mvbus{animation:mvbus 4.5s linear infinite}
@keyframes mvbus{0%{transform:translateX(0)}100%{transform:translateX(430px)}}
.bounce{animation:bnc .35s ease-in-out infinite}
@keyframes bnc{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pls 1.2s ease-in-out infinite}
@keyframes pls{0%,100%{transform:translate(0,-50px) scale(1)}50%{transform:translate(0,-50px) scale(1.15)}}
@keyframes popin{0%,60%{opacity:0;transform:translateY(6px)}72%,95%{opacity:1;transform:translateY(0)}100%{opacity:0}}
#pager{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:center;gap:14px;padding:10px;background:#fffc;backdrop-filter:blur(6px);border-top:2px solid var(--pink)}
#pager button{border:0;background:var(--coral);color:#fff;font-size:15px;font-weight:700;border-radius:999px;padding:9px 18px;cursor:pointer}
#pager button:disabled{background:#e8d5de;cursor:default}
#pinfo{font-weight:700;min-width:90px;text-align:center}
main{padding-bottom:90px}
.mvka{animation:mvka 3.6s linear infinite}
@keyframes mvka{0%{transform:translateX(0)}100%{transform:translateX(190px)}}
.mvma{animation:mvma 3.6s ease-out infinite}
@keyframes mvma{0%{transform:translateX(0)}75%,100%{transform:translateX(205px)}}
.grow{transform-box:fill-box;transform-origin:0 50%;animation:growx 3.6s ease-out infinite}
@keyframes growx{0%{transform:scaleX(.02)}75%,100%{transform:scaleX(1)}}
.mvmi{animation:mvmi 3.6s ease-out infinite}
@keyframes mvmi{0%{transform:translateX(0)}60%,100%{transform:translateX(105px)}}
.paper{animation:paperfly 3.6s infinite}
@keyframes paperfly{0%,60%{opacity:0;transform:translate(0,0)}61%{opacity:1;transform:translate(0,0)}72%{opacity:1;transform:translate(34px,-18px)}84%{opacity:1;transform:translate(66px,8px)}85%,100%{opacity:0;transform:translate(66px,8px)}}
.appear{transform-box:fill-box;transform-origin:50% 100%;animation:app 4s infinite backwards}
@keyframes app{0%{transform:scale(0);opacity:0}10%{transform:scale(1.2);opacity:1}16%,84%{transform:scale(1);opacity:1}94%,100%{transform:scale(0);opacity:0}}
.dash{animation:dashm 1s linear infinite}
@keyframes dashm{to{stroke-dashoffset:-12}}
.jump2{animation:jump 1.4s ease-in-out infinite}
.beat{transform-box:fill-box;transform-origin:50% 50%;animation:beat 1.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
@keyframes beatp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.spot{opacity:.5;animation:spotp 1.6s ease-in-out infinite}
@keyframes spotp{0%,100%{opacity:.3}50%{opacity:.7}}
.puff{transform-box:fill-box;transform-origin:50% 50%;animation:puff 2s ease-in-out infinite}
@keyframes puff{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
</style>
</head>
<body>
<header>
  <h1>🌸 穩紮穩打 N4 文法小卡</h1>
  <input id="q" placeholder="搜尋：が、吃、地點、方向…">
</header>
<div id="nav"></div>
<main id="list"></main>
<div id="pager"><button id="prevB">◀ 上一個</button><span id="pinfo"></span><button id="nextB">下一個 ▶</button></div>

<script>
/* ===== 場景模板（共用動畫，每張卡只選一個） ===== */
const KID=(cls='')=>`<g class="kid ${cls}">
<g class="leg l"><rect x="-8" y="22" width="7" height="17" rx="3.5" fill="#f2c4a0"/><ellipse cx="-3" cy="40" rx="6.5" ry="3.2" fill="#fff" stroke="#e0c9d4" stroke-width="1"/></g>
<g class="leg r"><rect x="1" y="22" width="7" height="17" rx="3.5" fill="#f2c4a0"/><ellipse cx="6" cy="40" rx="6.5" ry="3.2" fill="#fff" stroke="#e0c9d4" stroke-width="1"/></g>
<rect x="-12" y="3" width="24" height="24" rx="9" fill="#fff" stroke="#4a3f47" stroke-width="1.8"/>
<path d="M-13 21 H13 L14 31 Q14 33 12 33 H2 L0 27 L-2 33 H-12 Q-14 33 -14 31Z" fill="#ff9a3c"/>
<g class="head">
<g fill="#5a3d2e"><circle cx="-2" cy="-16" r="20"/><circle cx="-2" cy="-36" r="8"/><circle cx="-15" cy="-31" r="8"/><circle cx="12" cy="-31" r="8"/><circle cx="-22" cy="-18" r="8"/><circle cx="-19" cy="-5" r="7"/><circle cx="20" cy="-20" r="7"/></g>
<circle cx="2" cy="-9" r="16.5" fill="#ffe1c9"/>
<circle cx="9" cy="-10" r="2.4" fill="#4a3f47"/><circle cx="13" cy="-3" r="2.8" fill="#ff9aa8" opacity=".75"/>
<path d="M6 -1 Q9 3 12 -1" stroke="#4a3f47" fill="none" stroke-width="1.5" stroke-linecap="round"/></g></g>`;
const CAT=`<g><path d="M20 22 Q42 14 35 -4" stroke="#ffa24d" stroke-width="7" fill="none" stroke-linecap="round"/>
<path d="M33 16 L38 12 M37 6 L42 4 M36 -1 L41 -3" stroke="#d9691a" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="0" cy="18" rx="21" ry="15" fill="#ffa24d"/>
<path d="M-12 6 L-6 12 M-4 4 L-1 11 M5 4 L3 11 M13 7 L8 12" stroke="#d9691a" stroke-width="3" stroke-linecap="round"/>
<circle cx="0" cy="-5" r="17" fill="#ffa24d"/>
<path d="M-15 -15 L-13 -33 L-3 -20Z M15 -15 L13 -33 L3 -20Z" fill="#ffa24d"/>
<path d="M-12 -19 L-12 -27 L-6 -21Z M12 -19 L12 -27 L6 -21Z" fill="#ffb8c8"/>
<path d="M0 -21 V-13 M-6 -20 L-5 -14 M6 -20 L5 -14" stroke="#d9691a" stroke-width="2.6" stroke-linecap="round"/>
<path d="M-17 -4 H-11 M-17 1 L-11 0 M17 -4 H11 M17 1 L11 0" stroke="#d9691a" stroke-width="2.4" stroke-linecap="round"/>
<ellipse cx="0" cy="2" rx="7" ry="5" fill="#fff3e0"/>
<circle cx="-6" cy="-6" r="2.3" fill="#4a3f47"/><circle cx="6" cy="-6" r="2.3" fill="#4a3f47"/>
<path d="M-1.5 -1 H1.5 L0 1Z" fill="#ff8aa0"/>
<path d="M-3 3 Q0 5.5 3 3" stroke="#4a3f47" fill="none" stroke-width="1.4" stroke-linecap="round"/></g>`;
const SCHOOL=`<g><rect x="-34" y="-30" width="68" height="46" fill="#ffe0a3"/><path d="M-41 -30 L0 -56 L41 -30Z" fill="#ff8f7a"/>
<rect x="-8" y="-4" width="16" height="20" rx="3" fill="#8b6b4a"/><rect x="-27" y="-21" width="13" height="13" rx="2" fill="#bfe3ff"/><rect x="14" y="-21" width="13" height="13" rx="2" fill="#bfe3ff"/>
<line x1="0" y1="-56" x2="0" y2="-74" stroke="#8b6b4a" stroke-width="2"/><path d="M0 -74 L15 -69 L0 -63Z" fill="#ff6b4a"/></g>`;
const BUS=`<g><rect x="-42" y="-28" width="84" height="40" rx="11" fill="#ffd35c"/>
<rect x="-33" y="-19" width="16" height="15" rx="3" fill="#bfe3ff"/><rect x="-12" y="-19" width="16" height="15" rx="3" fill="#bfe3ff"/><rect x="9" y="-19" width="14" height="15" rx="3" fill="#bfe3ff"/><path d="M27 -19 H36 Q40 -19 40 -14 V-4 H27Z" fill="#bfe3ff"/>
<circle cx="40" cy="6" r="3.2" fill="#fff"/><rect x="-42" y="2" width="84" height="4" fill="#ff9ec4"/>
<g transform="translate(-22,14)"><g class="spin"><circle r="10" fill="#4a3f47"/><circle r="4" fill="#ddd"/><line x1="-8" y1="0" x2="8" y2="0" stroke="#ddd" stroke-width="2"/></g></g>
<g transform="translate(22,14)"><g class="spin"><circle r="10" fill="#4a3f47"/><circle r="4" fill="#ddd"/><line x1="-8" y1="0" x2="8" y2="0" stroke="#ddd" stroke-width="2"/></g></g></g>`;
const TREE=`<g><rect x="-4" y="-6" width="8" height="26" fill="#a47a52"/><circle cx="0" cy="-16" r="18" fill="#7fd1a3"/></g>`;
const SVG=b=>`<svg viewBox="0 0 300 130" preserveAspectRatio="xMidYMax meet" style="position:absolute;inset:0;width:100%;height:100%">${b}</svg>`;
const SCENES={
ga:SVG(`<g transform="translate(34,64)"><g class="wig"><rect x="-34" y="-12" width="16" height="30" rx="5" fill="#ff9ec4"/>
<rect x="-20" y="-8" width="32" height="26" rx="11" fill="#ffe1c9"/>
<rect x="2" y="-10" width="42" height="11" rx="5.5" fill="#ffe1c9"/>
<path d="M-12 -8 Q-6 -20 4 -10Z" fill="#ffe1c9"/>
<path d="M12 6 H2 M12 12 H2 M10 18 H2" stroke="#e3b698" stroke-width="2" stroke-linecap="round"/>
<path d="M-4 -4 Q2 -8 8 -4" stroke="#e3b698" stroke-width="1.6" fill="none" stroke-linecap="round"/></g></g>
<g transform="translate(205,66)"><g class="jump">${CAT}</g></g>`)
 +`<div class="pop" style="left:44%;top:10px">が</div><div class="g">「就是這隻！」被點名的主角</div>`,
wo:SVG(`<rect x="170" y="80" width="80" height="8" rx="3" fill="#c8a27a"/><rect x="180" y="88" width="6" height="12" fill="#c8a27a"/><rect x="234" y="88" width="6" height="12" fill="#c8a27a"/>
<g transform="translate(205,80)"><g class="apple"><circle cx="0" cy="-14" r="14" fill="#ff5a5a"/><path d="M0 -28 Q2 -36 8 -36" stroke="#6b4a2f" fill="none" stroke-width="2.5"/><ellipse cx="8" cy="-33" rx="6" ry="3" fill="#6fcf97"/></g></g>
<g transform="translate(130,60)">${KID('still chew')}</g>`)
 +`<div class="pop" style="left:57%;top:6px">を</div><div class="g">動作直接作用在「蘋果」上</div>`,
ni:SVG(`<g transform="translate(250,82)">${SCHOOL}</g>
<g transform="translate(28,60)"><g class="mvni">${KID()}</g></g>`)
 +`<div class="pop" style="left:68%;top:6px;animation:popin 3.2s infinite">に</div><div class="g">走到、落在「一個點」上</div>`,
de:SVG(`<g transform="translate(60,80)">${TREE}</g><g transform="translate(250,80)">${TREE}</g>
<g transform="translate(-60,75)"><g class="mvbus"><g class="bounce">${BUS}</g></g></g>`)
 +`<div class="pop" style="left:44%;top:6px">で</div><div class="g">用「公車」當手段／在這裡做事</div>`,
he:SVG(`<g transform="translate(240,98)"><rect x="-3" y="-62" width="6" height="62" fill="#a47a52"/><g class="pulse" transform="translate(0,-50)"><path d="M-30 -12 H6 V-20 L32 0 L6 20 V12 H-30Z" fill="#ff6b4a"/><text x="-10" y="5" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">へ</text></g></g>
<g transform="translate(28,60)"><g class="mvhe">${KID()}</g></g>`)
 +`<div class="pop" style="left:44%;top:6px">へ</div><div class="g">朝著「那個方向」前進</div>`
};

const FLAG=(c)=>`<g><rect x="-2" y="-40" width="4" height="40" fill="#8b6b4a"/><path d="M2 -40 H24 L18 -32 L24 -24 H2Z" fill="${c}"/></g>`;
const ROAD=(x1,x2,cls='')=>`<rect class="${cls}" x="${x1}" y="94" width="${x2-x1}" height="8" rx="4" fill="#f3d9a8"/>`;
const CAKE=`<g><rect x="-15" y="-15" width="30" height="15" rx="4" fill="#ffb3cc"/><rect x="-15" y="-20" width="30" height="7" rx="3.5" fill="#fff"/><circle cx="0" cy="-24" r="4" fill="#ff4d6d"/></g>`;
const BANANA=`<g><path d="M-14 -6 Q0 10 15 -20" stroke="#ffd84d" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M15 -20 l3 -5" stroke="#8b6b4a" stroke-width="3" stroke-linecap="round"/></g>`;
const APPLE=`<g><circle cx="0" cy="-12" r="12" fill="#ff5a5a"/><path d="M0 -24 Q2 -31 7 -31" stroke="#6b4a2f" fill="none" stroke-width="2.4"/><ellipse cx="7" cy="-28" rx="5" ry="2.6" fill="#6fcf97"/></g>`;
const MAILBOX=`<g><rect x="-3" y="-4" width="6" height="26" fill="#8b6b4a"/><rect x="-16" y="-30" width="32" height="28" rx="8" fill="#ff6b4a"/><rect x="-9" y="-19" width="18" height="4" rx="2" fill="#7a2e20"/></g>`;
const HEART=`<path d="M0 6 C-13 -4 -7 -15 0 -8 C7 -15 13 -4 0 6Z" fill="#ff5a7a"/>`;
Object.assign(SCENES,{
ka:SVG(`<g transform="translate(60,98)">${FLAG('#6fcf97')}</g>
<path d="M68 98 H290" stroke="#e8c88a" stroke-width="4" stroke-dasharray="3 8" stroke-linecap="round"/>
<g transform="translate(66,60)"><g class="mvka">${KID()}</g></g>`)
 +`<div class="pop" style="left:20%;top:6px">から</div><div class="g">「從這裡出發」的起跑線</div>`,
ma:SVG(`${ROAD(30,250,'grow')}<g transform="translate(262,98)">${FLAG('#ff6b4a')}</g>
<g transform="translate(36,60)"><g class="mvma">${KID()}</g></g>`)
 +`<div class="pop" style="left:66%;top:6px">まで</div><div class="g">一路走到「這裡」才停</div>`,
mi:SVG(`<g transform="translate(272,98)">${FLAG('#ff6b4a')}<text x="4" y="-27" font-size="9" font-weight="800" fill="#fff">5時</text></g>
<g transform="translate(205,98)">${MAILBOX}</g>
<g transform="translate(30,60)"><g class="mvmi">${KID()}</g></g>
<g transform="translate(140,72)"><g class="paper"><rect x="-7" y="-9" width="14" height="18" rx="2" fill="#fff" stroke="#4a3f47" stroke-width="1.4"/><path d="M-3 -4 H3 M-3 0 H3 M-3 4 H1" stroke="#9aa" stroke-width="1.2"/></g></g>`)
 +`<div class="pop" style="left:50%;top:6px;animation:popin 3.6s infinite">までに</div><div class="g">在期限「以前」交出去就OK</div>`,
to:SVG(`<rect x="130" y="82" width="160" height="8" rx="3" fill="#c8a27a"/><rect x="140" y="90" width="6" height="10" fill="#c8a27a"/><rect x="274" y="90" width="6" height="10" fill="#c8a27a"/>
<g transform="translate(60,60)">${KID('still')}</g>
<g transform="translate(160,82)"><g class="appear" style="animation-delay:0s">${APPLE}</g></g>
<g transform="translate(212,82)"><g class="appear" style="animation-delay:.7s">${CAKE}</g></g>
<g transform="translate(262,82)"><g class="appear" style="animation-delay:1.4s">${BANANA}</g></g>
<text class="appear" style="animation-delay:.7s" x="186" y="62" font-size="12" font-weight="800" fill="#ff6b4a" text-anchor="middle">とか</text>
<text class="appear" style="animation-delay:1.4s" x="237" y="62" font-size="12" font-weight="800" fill="#ff6b4a" text-anchor="middle">とか</text>`)
 +`<div class="pop" style="left:34%;top:6px">とか</div><div class="g">「蘋果啦、蛋糕啦、香蕉啦…」舉例</div>`,
no:SVG(`<g transform="translate(60,60)">${KID('still')}</g>
<path d="M82 50 Q130 14 176 46" stroke="#ff6b4a" stroke-width="3" fill="none" stroke-dasharray="6 6" class="dash" stroke-linecap="round"/>
<g transform="translate(205,66)"><g class="jump2">${CAT}</g></g>
<g transform="translate(205,22)"><g class="beat">${HEART}</g></g>`)
 +`<div class="pop" style="left:42%;top:4px;animation:beatp 1.2s infinite">の</div><div class="g">「小孩的貓」の＝的</div>`
});

Object.assign(SCENES,{
wa:SVG(`<g transform="translate(60,60)">${KID('still')}</g>
<polygon class="spot" points="205,0 160,98 250,98" fill="#fff59a"/>
<g transform="translate(205,66)"><g class="jump2">${CAT}</g></g>`)
 +`<div class="pop" style="left:40%;top:8px">は</div><div class="g">「說到…」聚光燈打在話題上</div>`,

/* ===== 畫面 ===== */
const pager=document.getElementById('pager'),pinfo=document.getElementById('pinfo'),prevB=document.getElementById('prevB'),nextB=document.getElementById('nextB');
const list=document.getElementById('list'),nav=document.getElementById('nav'),q=document.getElementById('q');
let unitFilter=-1;
let cur=0,flat=[];
function build(){
  const kw=q.value.trim().toLowerCase();flat=[];
  UNITS.forEach((u,ui)=>{if(unitFilter>=0&&unitFilter!==ui)return;
    u.cards.forEach(c=>{const blob=(c.no+c.t+c.form+c.explain+c.cmp+c.ex.map(e=>e.jp+e.kana+e.zh+e.why).join('')).toLowerCase();
      if(!kw||blob.includes(kw))flat.push({u:u.name,c});});});
  if(cur>=flat.length)cur=0;
}
function render(){
  const c0=flat[cur];
  if(!c0){list.innerHTML='<div class="empty">找不到 🥲</div>';pager.style.visibility='hidden';return}
  pager.style.visibility='visible';
  const c=c0.c;
  list.innerHTML=`<div class="unit">${c0.u}</div><section class="card" id="c${c.no}">
    <div class="top"><span class="no">${c.no}</span><span class="title">${c.t}</span></div>
    <div class="scene" title="點一下重播" onclick="replay(this)">${SCENES[c.scene]}</div>
    <div class="sec"><span class="lab">接續</span><div class="formula">${c.form}</div></div>
    <div class="sec"><span class="lab">白話拆解</span><div class="explain">${c.explain}</div></div>
    <div class="sec"><span class="lab">例句</span> <span class="hint">（點句子看讀音＋拆解）</span>
    ${c.ex.map(e=>`<div class="ex" onclick="this.classList.toggle('open')"><div class="jp">${e.jp}</div><div class="zh">${e.zh}</div><div class="more">${e.kana}<br>👉 ${e.why}</div></div>`).join('')}</div>
    <div class="cmp">${c.cmp}</div></section>`;
  pinfo.textContent=`${c.no}　(${cur+1} / ${flat.length})`;
  prevB.disabled=cur===0;nextB.disabled=cur===flat.length-1;
  window.scrollTo(0,0);
}
function go(d){const n=cur+d;if(n<0||n>=flat.length)return;cur=n;render()}
function replay(el){const s=el.innerHTML;el.innerHTML='';void el.offsetWidth;el.innerHTML=s}
function buildNav(){
  nav.innerHTML='<button class="on" data-u="-1">全部</button>'+UNITS.map((u,i)=>`<button data-u="${i}">${u.name.replace('第','').replace('單元','').trim()}</button>`).join('');
  nav.onclick=e=>{const b=e.target.closest('button');if(!b)return;unitFilter=+b.dataset.u;cur=0;[...nav.children].forEach(x=>x.classList.toggle('on',x===b));build();render()};
}
q.oninput=()=>{cur=0;build();render()};
prevB.onclick=()=>go(-1);nextB.onclick=()=>go(1);
document.addEventListener('keydown',e=>{if(e.target===q)return;if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1)});
let tx=null;document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)>70)go(d<0?1:-1)});
buildNav();build();render();
</script>
</body>
